<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRNtrack - 404</title>
    <link rel="icon" type="image/vnd.icon" href="https://i.postimg.cc/pLqpbbHb/IMG-0226f.png">
    
    <!-- Typographie Poppins -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/common.css">
    
    <style>

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: var(--font-sans); 
            margin: 0; 
            padding: 0;
            -webkit-font-smoothing: antialiased; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            padding-bottom: var(--nav-height-mobile);
            opacity: 0; 
            transition: opacity 0.3s ease-in-out;
        }
        body.ready { opacity: 1; }

        /* --- NAVIGATION SUPÉRIEURE --- */

        .nav-link:hover, .nav-link.active {
            border-bottom-color: var(--color-dark);
            font-weight: 600;
        }

        .btn-auth-trigger.logged-in {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-auth-trigger.logged-in:hover {
            background: var(--primary);
            color: #ffffff;
        }

        /* Mobile Hamburger Button */

        .mobile-drawer .nav-link {
            font-size: 1rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--color-border);
            width: 100%;
        }

        @media (min-width: 993px) { body { padding-bottom: 0; } }

        /* --- 404 CONTENT STYLE --- */
        .container { 
            max-width: 900px; 
            margin: auto; 
            padding: 60px 20px; 
            width: 100%; 
            box-sizing: border-box; 
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .error-card {
            background: #FFFFFF;
            border: 1px solid var(--color-border);
            padding: 50px 40px;
            box-shadow: var(--shadow);
            max-width: 550px;
            width: 100%;
        }

        .hirono-lost {
            width: 220px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.06));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            line-height: 1;
            color: var(--color-dark);
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        h2 {
            font-size: 1.2rem;
            margin: 15px 0 15px 0;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        p {
            color: var(--text-sub);
            margin-bottom: 30px;
            font-size: 0.88rem;
            line-height: 1.6;
        }

        .btn-home {
            background: var(--color-dark);
            color: var(--color-light);
            border: 1px solid var(--color-dark);
            padding: 12px 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.82rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.25s ease;
            display: inline-block;
        }

        .btn-home:hover {
            background: transparent;
            color: var(--color-dark);
        }

        /* MODALS & INPUTS */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(26, 26, 26, 0.7); 
            z-index: 3000; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(4px); 
            padding: 1rem;
        }
        .modal-content { 
            background: #FCFBF8; 
            border: 1px solid var(--color-border);
            width: 100%; 
            max-width: 440px; 
            padding: 2.2rem; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); 
            max-height: 90vh; 
            overflow-y: auto; 
            position: relative; 
        }
        .btn-save { 
            width: 100%; 
            background: var(--color-dark); 
            color: var(--color-light); 
            border: 1px solid var(--color-dark); 
            padding: 12px; 
            font-family: var(--font-sans);
            font-weight: 600; 
            font-size: 0.82rem; 
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer; 
            margin-top: 15px; 
            transition: all 0.25s ease; 
        }
        .btn-save:hover { background: transparent; color: var(--color-dark); }
        .btn-cancel { 
            width: 100%; 
            background: transparent; 
            border: none; 
            color: var(--color-text-sub); 
            padding: 10px; 
            cursor: pointer; 
            margin-top: 5px; 
            font-size: 0.78rem; 
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: underline;
        }
        .btn-cancel:hover { color: var(--color-red); }

        input { 
            width: 100%; padding: 10px 12px; border: 1px solid var(--color-border); 
            font-family: var(--font-sans); font-size: 0.85rem; box-sizing: border-box; background: #FFFFFF;
            color: var(--color-dark); outline: none; transition: border-color 0.25s ease; margin-bottom: 10px; 
        }
        input:focus { border-color: var(--color-dark); }

        .auth-title { text-align: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: var(--color-dark); }
        .auth-separator { margin: 1.2rem 0; font-size: 0.75rem; letter-spacing: 0.15em; color: var(--color-text-sub); text-align: center; }
    </style>
</head>
<body>

    <script src="assets/header.js"></script>

    <div class="container">
        <div class="error-card">
            <img src="https://i.postimg.cc/4Nyv3p9k/1765529816912_lost_in_the_night.webp" alt="Lost Hirono" class="hirono-lost">
            
            <h1>404</h1>
            <h2 data-t="title">Oups ! Perdu dans la nuit ?</h2>
            <p data-t="msg">
                Il semble que cette page n'existe pas...<br>
                Ou alors elle s'est bien cachée.
            </p>

            <a href="index.html" class="btn-home">
                <span data-t="btn">Retour à l'accueil</span>
            </a>
        </div>
    </div>

    <!-- MODAL D'AUTHENTIFICATION -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content" style="text-align:center; max-width:440px;">
            <div class="auth-title" data-t="authLogin">Connexion</div>
            <p style="color:var(--color-text-sub); font-size:13px; margin-bottom:20px;" data-t="authDesc">
                Sauvegardez votre collection dans le cloud.
            </p>
            
            <input type="email" id="auth-email" placeholder="Email" style="margin-bottom:12px;">
            <input type="password" id="auth-pass" placeholder="Mot de passe" style="margin-bottom:12px;">
            
            <div style="text-align: right; margin-bottom: 15px;">
                <button class="btn-cancel" style="display:inline; padding:0; margin:0; width:auto; font-size:11px;" onclick="window.handleResetPassword()" data-t="btnForgot">Mot de passe oublié ?</button>
            </div>

            <button class="btn-save" onclick="window.handleLogin()" style="background:var(--primary); border-color:var(--primary);" data-t="btnLogin">Se connecter</button>
            
            <div class="auth-separator">OU</div>
            
            <button class="btn-save" onclick="window.handleGoogleLogin()" style="background:white; color:var(--text-main); border:1px solid var(--color-border); margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:18px; height:18px;" alt="Google">
                <span data-t="btnGoogle">Continuer avec Google</span>
            </button>

            <button class="btn-save" onclick="window.handleRegister()" style="background:white; color:var(--text-main); border:1px solid var(--color-border);" data-t="btnRegister">
                Créer un compte (Email)
            </button>
            
            <button class="btn-cancel" onclick="window.toggleAuthModal()" data-t="btnCancel">Annuler</button>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="assets/site.js"></script>

    <script type="module">
        import { app } from './assets/firebase.js';
        import { withCommon, syncLangToggle } from './assets/i18n.js';
        import { auth, setupAuthModal, updateAuthButtons, updateAuthLabel } from './assets/auth.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const translations = withCommon({
            fr: {                title: "Oups ! Perdu dans la nuit ?",                msg: "Il semble que cette page n'existe pas...<br>Ou alors elle s'est bien cachée.",                btn: "Retour à l'accueil"                },            en: {                title: "Oops! Lost in the night?",                msg: "It seems this page doesn't exist...<br>Or maybe it's hiding very well.",                btn: "Back to Home"                }        });

        let currentLang = localStorage.getItem('HRN_LANG') || 'fr';

        window.toggleLanguage = () => {
            currentLang = (currentLang === 'fr') ? 'en' : 'fr';
            localStorage.setItem('HRN_LANG', currentLang);
            updateUIText();
        };

        window.updateUIText = function() {
            syncLangToggle(currentLang);

            const t = translations[currentLang];
            document.querySelectorAll('[data-t]').forEach(el => {
                const key = el.getAttribute('data-t');
                if(t[key]) el.innerHTML = t[key];
            });

            updateAuthLabel(t);
        }

        setupAuthModal(() => currentLang);

        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.style.display = "none";
            }
        }

        onAuthStateChanged(auth, async (user) => {
            updateUIText();
            
            updateAuthButtons(!!user);
            document.body.classList.add('ready');
        });

        fetch('footer.html')
            .then(response => {
                if (!response.ok) throw new Error("Impossible de charger le footer");
                return response.text();
            })
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
                if(window.updateUIText) window.updateUIText();
                if(window.initCookieLogic) window.initCookieLogic();
            })
            .catch(error => {
                console.error('Erreur chargement footer:', error);
            });
    </script>
</body>
</html>
