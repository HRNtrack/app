<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRNtrack</title>
    <link rel="icon" type="image/vnd.icon" href="https://i.postimg.cc/pLqpbbHb/IMG-0226f.png">
    
    <!-- Typographie Poppins -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/common.css">

    <style>

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: var(--font-sans); 
            margin: 0; 
            padding: 0;
            -webkit-font-smoothing: antialiased; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            padding-bottom: var(--nav-height-mobile);
            opacity: 0; 
            transition: opacity 0.3s ease-in-out;
        }
        body.auth-ready { opacity: 1; }

        /* --- NAVIGATION SUPÉRIEURE --- */

        .nav-link:hover, .nav-link.active {
            border-bottom-color: var(--color-dark);
            font-weight: 600;
        }

        .btn-auth-trigger.logged-in {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-auth-trigger.logged-in:hover {
            background: var(--primary);
            color: #ffffff;
        }

        /* Mobile Hamburger Button */

        .mobile-drawer .nav-link {
            font-size: 1rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--color-border);
            width: 100%;
        }

        @media (min-width: 993px) { body { padding-bottom: 0; } }

        /* --- FORMULAIRE CONTACT --- */
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; box-sizing: border-box; }
        
        .contact-card {
            background: #FFFFFF; 
            padding: 40px; 
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow);
        }

        h1 { color: var(--color-dark); margin-bottom: 8px; font-size: 1.5rem; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: 0.05em; }
        p.subtitle { text-align: center; color: var(--color-text-sub); margin-bottom: 30px; font-size: 0.88rem; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--color-dark); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
        input, textarea, select {
            width: 100%; padding: 10px 12px; border: 1px solid var(--color-border);
            font-family: var(--font-sans); font-size: 0.85rem; box-sizing: border-box; background: #FFFFFF;
            color: var(--color-dark); outline: none; transition: border-color 0.25s ease;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--color-dark); }
        
        textarea { resize: vertical; min-height: 120px; }

        .btn-send {
            width: 100%; background: var(--color-dark); color: var(--color-light);
            padding: 14px; border: 1px solid var(--color-dark);
            font-family: var(--font-sans); font-weight: 600; font-size: 0.82rem;
            letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
            transition: all 0.25s ease; margin-top: 10px;
        }
        .btn-send:hover { background: transparent; color: var(--color-dark); }

        #snow-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* MODALS & INPUTS */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(26, 26, 26, 0.7); 
            z-index: 3000; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(4px); 
            padding: 1rem;
        }
        .modal-content { 
            background: #FCFBF8; 
            border: 1px solid var(--color-border);
            width: 100%; 
            max-width: 440px; 
            padding: 2.2rem; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); 
            max-height: 90vh; 
            overflow-y: auto; 
            position: relative; 
        }
        
        .btn-save { 
            width: 100%; 
            background: var(--color-dark); 
            color: var(--color-light); 
            border: 1px solid var(--color-dark); 
            padding: 12px; 
            font-family: var(--font-sans);
            font-weight: 600; 
            font-size: 0.82rem; 
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer; 
            margin-top: 15px; 
            transition: all 0.25s ease; 
        }
        .btn-save:hover { background: transparent; color: var(--color-dark); }
        .btn-cancel { 
            width: 100%; 
            background: transparent; 
            border: none; 
            color: var(--color-text-sub); 
            padding: 10px; 
            cursor: pointer; 
            margin-top: 5px; 
            font-size: 0.78rem; 
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: underline;
        }
        .btn-cancel:hover { color: var(--color-red); }

        .auth-title { text-align: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: var(--color-dark); }
        .auth-separator { margin: 1.2rem 0; font-size: 0.75rem; letter-spacing: 0.15em; color: var(--color-text-sub); text-align: center; }
    </style>
</head>
<body>
    <canvas id="snow-canvas"></canvas>
    
    <script src="assets/header.js" data-active="contact"></script>

    <div class="container">
        <div class="contact-card">
            <h1 data-t="pageTitle">Contactez-nous</h1>
            <p class="subtitle" data-t="pageSubtitle">Une suggestion pour HRNtrack ? Un bug ? Ou juste un petit coucou ?</p>
            
            <form id="contactForm" onsubmit="event.preventDefault(); sendContact();">
                <div class="form-group">
                    <label data-t="lblYourName">Votre Nom</label>
                    <input type="text" id="c-name" name="name" data-t-placeholder="phName" placeholder="Votre pseudo ou nom" required>
                </div>
                <div class="form-group">
                    <label data-t="lblYourEmail">Votre Email</label>
                    <input type="email" id="c-email" name="email" data-t-placeholder="phEmail" placeholder="Pour vous répondre" required>
                </div>
                <div class="form-group">
                    <label data-t="lblSubject">Sujet</label>
                    <select id="c-subject" name="_subject">
                        <option value="Suggestion" id="opt-sugg">Suggestion</option>
                        <option value="Bug" id="opt-bug">Signaler un bug</option>
                        <option value="Autre" id="opt-other">Autre</option>
                    </select>
                </div>
                <div class="form-group">
                    <label data-t="lblMessage">Message</label>
                    <textarea id="c-message" name="message" data-t-placeholder="phMessage" placeholder="Dites-nous tout..." required></textarea>
                </div>
                
                <input type="text" name="_honey" style="display:none">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">
                
                <button type="submit" class="btn-send" data-t="btnSend">Envoyer le message</button>
            </form>
        </div>
    </div>

    <!-- MODAL D'AUTHENTIFICATION -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content" style="text-align:center; max-width:440px;">
            <div class="auth-title" data-t="authLogin">Connexion</div>
            <p style="color:var(--color-text-sub); font-size:13px; margin-bottom:20px;" data-t="authDesc">Sauvegardez votre collection dans le cloud.</p>
            
            <input type="email" id="auth-email" placeholder="Email" style="margin-bottom:12px;">
            <input type="password" id="auth-pass" placeholder="Mot de passe" style="margin-bottom:12px;">
            
            <div style="text-align: right; margin-bottom: 15px;">
                <button class="btn-cancel" style="display:inline; padding:0; margin:0; width:auto; font-size:11px;" onclick="window.handleResetPassword()" data-t="btnForgot">Mot de passe oublié ?</button>
            </div>

            <button class="btn-save" onclick="window.handleLogin()" data-t="btnLogin">Se connecter</button>
            
            <div class="auth-separator">OU</div>
            
            <button class="btn-save" onclick="window.handleGoogleLogin()" style="background:white; color:var(--text-main); border:1px solid var(--color-border); margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:18px; height:18px;" alt="Google">
                <span data-t="btnGoogle">Continuer avec Google</span>
            </button>

            <button class="btn-save" onclick="window.handleRegister()" style="background:white; color:var(--text-main); border:1px solid var(--color-border);" data-t="btnRegister">Créer un compte (Email)</button>
            <button class="btn-cancel" onclick="window.toggleAuthModal()" data-t="btnCancel">Annuler</button>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="assets/site.js"></script>

    <script type="module">
        import { app } from './assets/firebase.js';
        import { withCommon, syncLangToggle } from './assets/i18n.js';
        import { auth, setupAuthModal, updateAuthButtons, updateAuthLabel } from './assets/auth.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const MY_EMAIL = "hironotrack@gmail.com"; 

        const translations = withCommon({
            fr: {                pageTitle: "Contactez-nous",                pageSubtitle: "Une suggestion pour HRNtrack ? Un bug ? Ou juste un petit coucou ?",                lblYourName: "Votre Nom", phName: "Votre pseudo ou nom",                lblYourEmail: "Votre Email", phEmail: "Pour vous répondre",                lblSubject: "Sujet",                optSugg: "Suggestion", optBug: "Signaler un bug", optOther: "Autre",                lblMessage: "Message", phMessage: "Dites-nous tout...",                btnSend: "Envoyer le message", btnSending: "Envoi en cours...",                alertSuccess: "Message envoyé avec succès ! Merci.",                alertError: "Erreur lors de l'envoi : "                },            en: {                pageTitle: "Contact Us",                pageSubtitle: "A suggestion for HRNtrack? A bug? Or just saying hi?",                lblYourName: "Your Name", phName: "Your nickname or name",                lblYourEmail: "Your Email", phEmail: "So we can reply",                lblSubject: "Subject",                optSugg: "Suggestion", optBug: "Report a bug", optOther: "Other",                lblMessage: "Message", phMessage: "Tell us everything...",                btnSend: "Send Message", btnSending: "Sending...",                alertSuccess: "Message sent successfully! Thanks.",                alertError: "Error sending message: "                }        });

        let currentLang = localStorage.getItem('HRN_LANG') || 'fr';
        
        window.toggleLanguage = () => { 
            currentLang = (currentLang === 'fr') ? 'en' : 'fr'; 
            localStorage.setItem('HRN_LANG', currentLang); 
            updateUIText(); 
        };

        window.updateUIText = function() {
            syncLangToggle(currentLang);

            const t = translations[currentLang];
            document.querySelectorAll('[data-t]').forEach(el => { const key = el.getAttribute('data-t'); if(t[key]) el.innerText = t[key]; });
            document.querySelectorAll('[data-t-placeholder]').forEach(el => { const key = el.getAttribute('data-t-placeholder'); if(t[key]) el.placeholder = t[key]; });
            
            const optSugg = document.getElementById('opt-sugg');
            const optBug = document.getElementById('opt-bug');
            const optOther = document.getElementById('opt-other');
            if(optSugg) optSugg.innerText = t.optSugg;
            if(optBug) optBug.innerText = t.optBug;
            if(optOther) optOther.innerText = t.optOther;

            updateAuthLabel(t);
        };
        
        setupAuthModal(() => currentLang);

        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.style.display = "none";
            }
        }

        window.sendContact = async () => {
            const t = translations[currentLang];
            const btn = document.querySelector('.btn-send');
            
            const name = document.getElementById('c-name').value;
            const email = document.getElementById('c-email').value;
            const subject = document.getElementById('c-subject').value;
            const message = document.getElementById('c-message').value;

            btn.innerText = t.btnSending;
            btn.disabled = true;

            try {
                await fetch(`https://formsubmit.co/ajax/${MY_EMAIL}`, {
                    method: "POST",
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        _subject: `[HRNtrack] ${subject} de ${name}`,
                        message: message
                    })
                });

                alert(t.alertSuccess);
                document.getElementById('contactForm').reset();

            } catch (e) {
                console.error(e);
                alert(t.alertError + e.message);
            } finally {
                btn.innerText = t.btnSend;
                btn.disabled = false;
            }
        };

        onAuthStateChanged(auth, (user) => {
            updateUIText();
            updateAuthButtons(!!user);
            document.body.classList.add('auth-ready');
        });

        fetch('footer.html')
            .then(response => {
                if (!response.ok) throw new Error("Erreur chargement footer");
                return response.text();
            })
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
                if(window.updateUIText) window.updateUIText();
                if(window.initCookieLogic) window.initCookieLogic();
            })
            .catch(error => console.error('Erreur Footer:', error));
    </script>
</body>
</html>
