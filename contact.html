<html lang="fr">
<head>

    <!-- Typographie Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-dark: #1A1A1A;
            --color-light: #F5F5F0;
            --color-sand: #EBE7DF;
            --color-border: #D8D2C5;
            --color-gold: #C6A875;
            --color-gold-light: #F9F5EB;
            --color-red: #C0392B; 
            --color-green: #6A8C47;
            --color-green-dark: #557235;
            --color-text-sub: #5E5D59;
            --card-bg: #FCFBF8;
            
            --primary: var(--color-green);
            --primary-dark: var(--color-green-dark);
            --bg-body: var(--color-light);
            --text-main: var(--color-dark);
            --text-sub: var(--color-text-sub);
            
            --font-sans: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            --nav-height: 75px;
            --nav-height-mobile: 70px;
            
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: var(--font-sans); 
            margin: 0; 
            padding: 0;
            -webkit-font-smoothing: antialiased; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            padding-bottom: var(--nav-height-mobile);
            opacity: 0; 
            transition: opacity 0.3s ease-in-out;
        }
        body.auth-ready { opacity: 1; }

        /* --- NAVIGATION SUPÉRIEURE --- */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3rem;
            height: var(--nav-height);
            background: rgba(216, 210, 197, 0.45);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--color-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-logo-group {
            display: flex;
            align-items: center;
        }

        .site-logo {
            height: 100px;
            width: auto;
            filter: brightness(0);
            transition: opacity 0.25s ease;
            display: block;
        }

        .site-logo:hover {
            opacity: 0.75;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-link {
            text-decoration: none;
            color: var(--color-dark);
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            transition: all 0.25s ease;
            display: inline-block;
        }

        .nav-link:hover, .nav-link.active {
            border-bottom-color: var(--color-dark);
            font-weight: 600;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-auth-trigger {
            background: transparent;
            border: 1px solid var(--color-dark);
            color: var(--color-dark);
            padding: 0.5rem 1.2rem;
            font-family: var(--font-sans);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-auth-trigger:hover {
            background: var(--color-dark);
            color: var(--color-light);
        }

        .btn-auth-trigger.logged-in {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-auth-trigger.logged-in:hover {
            background: var(--primary);
            color: #ffffff;
        }

        .lang-toggle {
            display: flex;
            border: 1px solid var(--color-border);
            cursor: pointer;
            background: var(--color-sand);
        }

        .lang-option {
            padding: 0.35rem 0.65rem;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-text-sub);
            transition: all 0.2s ease;
        }

        .lang-option.active {
            background: var(--color-dark);
            color: var(--color-light);
        }

        /* Mobile Hamburger Button */
        .mobile-menu-btn {
            display: none;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: var(--color-dark);
        }
        
        .mobile-menu-btn svg {
            width: 26px;
            height: 26px;
            stroke: var(--color-dark);
        }

        .mobile-drawer {
            display: none;
            position: fixed;
            top: var(--nav-height);
            left: 0; right: 0; bottom: 0;
            background: var(--color-light);
            border-top: 1px solid var(--color-border);
            flex-direction: column;
            padding: 2rem;
            gap: 1.5rem;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .mobile-drawer.open {
            display: flex;
        }

        .mobile-drawer .nav-link {
            font-size: 1rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--color-border);
            width: 100%;
        }

        .mobile-drawer .mobile-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        @media (min-width: 993px) { body { padding-bottom: 0; } }
        @media (max-width: 992px) {
            .top-nav { padding: 0 1.5rem; }
            .nav-center, .nav-right .btn-auth-trigger, .nav-right .lang-toggle { display: none; }
            .mobile-menu-btn { display: block; }
        }

        /* --- FORMULAIRE CONTACT --- */
        .container { max-width: 600px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; box-sizing: border-box; }
        
        .contact-card {
            background: #FFFFFF; 
            padding: 40px; 
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow);
        }

        h1 { color: var(--color-dark); margin-bottom: 8px; font-size: 1.5rem; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: 0.05em; }
        p.subtitle { text-align: center; color: var(--color-text-sub); margin-bottom: 30px; font-size: 0.88rem; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--color-dark); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
        input, textarea, select {
            width: 100%; padding: 10px 12px; border: 1px solid var(--color-border);
            font-family: var(--font-sans); font-size: 0.85rem; box-sizing: border-box; background: #FFFFFF;
            color: var(--color-dark); outline: none; transition: border-color 0.25s ease;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--color-dark); }
        
        textarea { resize: vertical; min-height: 120px; }

        .btn-send {
            width: 100%; background: var(--color-dark); color: var(--color-light);
            padding: 14px; border: 1px solid var(--color-dark);
            font-family: var(--font-sans); font-weight: 600; font-size: 0.82rem;
            letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
            transition: all 0.25s ease; margin-top: 10px;
        }
        .btn-send:hover { background: transparent; color: var(--color-dark); }

        #snow-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        /* MODALS & INPUTS */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(26, 26, 26, 0.7); 
            z-index: 3000; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(4px); 
            padding: 1rem;
        }
        .modal-content { 
            background: #FCFBF8; 
            border: 1px solid var(--color-border);
            width: 100%; 
            max-width: 440px; 
            padding: 2.2rem; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); 
            max-height: 90vh; 
            overflow-y: auto; 
            position: relative; 
        }
        
        .btn-save { 
            width: 100%; 
            background: var(--color-dark); 
            color: var(--color-light); 
            border: 1px solid var(--color-dark); 
            padding: 12px; 
            font-family: var(--font-sans);
            font-weight: 600; 
            font-size: 0.82rem; 
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer; 
            margin-top: 15px; 
            transition: all 0.25s ease; 
        }
        .btn-save:hover { background: transparent; color: var(--color-dark); }
        .btn-cancel { 
            width: 100%; 
            background: transparent; 
            border: none; 
            color: var(--color-text-sub); 
            padding: 10px; 
            cursor: pointer; 
            margin-top: 5px; 
            font-size: 0.78rem; 
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: underline;
        }
        .btn-cancel:hover { color: var(--color-red); }

        .auth-title { text-align: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: var(--color-dark); }
        .auth-separator { margin: 1.2rem 0; font-size: 0.75rem; letter-spacing: 0.15em; color: var(--color-text-sub); text-align: center; }
    </style>
</head>

    <script>
        window.toggleMobileMenu = function() {
            const drawer = document.getElementById('mobile-drawer');
            if (drawer) {
                drawer.classList.toggle('open');
            }
        };

        const GA_ID = 'G-RFP1HDMW49';

        function loadAnalytics() {
            if(document.querySelector(`script[src*="${GA_ID}"]`)) return;
            const script = document.createElement('script');
            script.src = `https://www.googletagmanager.com/gtag/js?id=${GA_ID}`;
            script.async = true;
            document.head.appendChild(script);
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', GA_ID);
        }

        window.handleCookie = function(accept) {
            const banner = document.getElementById('cookie-banner');
            if (accept) {
                localStorage.setItem('cookieConsent', 'true');
                loadAnalytics();
            } else {
                localStorage.setItem('cookieConsent', 'false');
            }
            if(banner) banner.style.display = 'none';
        };

        window.initCookieLogic = function() {
            const consent = localStorage.getItem('cookieConsent');
            const banner = document.getElementById('cookie-banner');
            if (consent === 'true') {
                loadAnalytics();
            } else if (consent === null && banner) {
                banner.style.display = 'block'; 
            }
        }
    </script>

        let currentLang = localStorage.getItem('HRN_LANG') || 'fr';

            currentLang = (currentLang === 'fr') ? 'en' : 'fr'; 
            localStorage.setItem('HRN_LANG', currentLang); 
            updateUIText();

        window.updateUIText = function() {
            if(currentLang === 'fr') { 
                const frBtn = document.getElementById('lang-fr');
                const enBtn = document.getElementById('lang-en');
                if(frBtn) frBtn.classList.add('active');
                if(enBtn) enBtn.classList.remove('active');

                if(enMob) enMob.classList.remove('active');

                const enBtn = document.getElementById('lang-en');
                if(frBtn) frBtn.classList.remove('active');
                if(enBtn) enBtn.classList.add('active');

                const frMob = document.getElementById('lang-fr-mob');

            }

            const t = translations[currentLang];
            document.querySelectorAll('[data-t]').forEach(el => { const key = el.getAttribute('data-t'); if(t[key]) el.innerText = t[key]; });
            document.querySelectorAll('[data-t-placeholder]').forEach(el => { const key = el.getAttribute('data-t-placeholder'); if(t[key]) el.placeholder = t[key]; });
            
            const optSugg = document.getElementById('opt-sugg');
            const optBug = document.getElementById('opt-bug');
            const optOther = document.getElementById('opt-other');
            if(optSugg) optSugg.innerText = t.optSugg;
            if(optBug) optBug.innerText = t.optBug;
            if(optOther) optOther.innerText = t.optOther;

            const user = auth.currentUser;
            const btnText = document.getElementById('auth-status-text');
            const btnTextMob = document.getElementById('auth-status-text-mob');
            if(btnText) btnText.innerText = user ? t.authAccount : t.authLogin;
            if(btnTextMob) btnTextMob.innerText = user ? t.authAccount : t.authLogin;
        };
        
        window.toggleAuthModal = () => { const el = document.getElementById('auth-modal'); el.style.display = (el.style.display === 'flex') ? 'none' : 'flex'; };

        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.style.display = "none";
            }
        }

        window.handleLogin = async () => { 
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            if(!email || !pass) return alert("Veuillez remplir les champs.");
            
            try { 
                const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                if (!userCredential.user.emailVerified) {
                    alert(currentLang === 'fr'
                        ? "Votre adresse email n'a pas encore été vérifiée. Veuillez cliquer sur le lien envoyé dans votre boîte mail."
                        : "Your email address has not been verified yet. Please click the link sent to your inbox.");
                    await signOut(auth);
                    return;
                }
                window.toggleAuthModal(); 
            } catch(e) { 
                alert("Erreur: " + e.message); 
            } 
        };

        window.handleRegister = async () => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            if(!email || !pass) return alert("Veuillez remplir les champs.");
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                await sendEmailVerification(userCredential.user);
                alert(currentLang === 'fr' 
                    ? "Compte créé avec succès ! Un lien de vérification a été envoyé. Veuillez vérifier votre boîte mail (et vos spams) pour valider votre compte avant de vous connecter."
                    : "Account successfully created! A verification link has been sent. Please check your inbox (and spam) to validate your account before logging in.");
                await signOut(auth);
                window.toggleAuthModal();
            } catch(e) { alert("Erreur: " + e.message); }
        };

        const googleProvider = new GoogleAuthProvider();

        window.handleGoogleLogin = async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                window.toggleAuthModal();
            } catch(e) { 
                alert("Erreur Google: " + e.message); 
            }
        };

        window.handleResetPassword = async () => {
            const email = document.getElementById('auth-email').value;
            if(!email) {
                alert(currentLang === 'fr' 
                    ? "Veuillez entrer votre adresse email dans le champ ci-dessus pour réinitialiser le mot de passe." 
                    : "Please enter your email address in the field above to reset your password.");
                return;
            }
            try {
                await sendPasswordResetEmail(auth, email);
                alert(currentLang === 'fr' 
                    ? "Email de réinitialisation envoyé ! Vérifiez vos courriers indésirables." 
                    : "Reset email sent! Check your spam folder.");
            } catch(e) { 
                alert("Erreur: " + e.message); 
            }
        };

        window.sendContact = async () => {
            const t = translations[currentLang];
            const btn = document.querySelector('.btn-send');
            
            const name = document.getElementById('c-name').value;
            const email = document.getElementById('c-email').value;
            const subject = document.getElementById('c-subject').value;
            const message = document.getElementById('c-message').value;

            btn.innerText = t.btnSending;
            btn.disabled = true;

            try {
                await fetch(`https://formsubmit.co/ajax/${MY_EMAIL}`, {
                    method: "POST",
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        _subject: `[HRNtrack] ${subject} de ${name}`,
                        message: message
                    })
                });

                alert(t.alertSuccess);
                document.getElementById('contactForm').reset();

            } catch (e) {
                console.error(e);
                alert(t.alertError + e.message);
            } finally {
                btn.innerText = t.btnSend;
                btn.disabled = false;
            }
        };

        onAuthStateChanged(auth, (user) => {
            updateUIText();
            const btn = document.getElementById('auth-trigger');
            const btnMob = document.getElementById('auth-trigger-mob');
            if (user) {
                if (btn) {
                    btn.classList.add('logged-in'); 
                    btn.onclick = () => window.location.href = "compte.html";
                }
                if (btnMob) {
                    btnMob.classList.add('logged-in');
                    btnMob.onclick = () => window.location.href = "compte.html";
                }
            } else {
                if (btn) {
                    btn.classList.remove('logged-in'); 
                    btn.onclick = () => window.toggleAuthModal();
                }
                if (btnMob) {
                    btnMob.classList.remove('logged-in');
                    btnMob.onclick = () => { window.toggleAuthModal(); window.toggleMobileMenu(); };
                }
            }
            document.body.classList.add('auth-ready');
        });

        fetch('footer.html')
            .then(response => {
                if (!response.ok) throw new Error("Erreur chargement footer");
                return response.text();
            })
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
                if(window.updateUIText) window.updateUIText();
                if(window.initCookieLogic) window.initCookieLogic();
            })
            .catch(error => console.error('Erreur Footer:', error));
    </script>
</body>
</html>
