    <style>
        :root {
            --color-dark: #1A1A1A;
            --color-light: #F5F5F0;
            --color-sand: #EBE7DF;
            --color-border: #D8D2C5;
            --color-gold: #C6A875;
            --color-gold-light: #F9F5EB;
            --color-red: #C0392B; 
            --color-green: #6A8C47;
            --color-green-dark: #557235;
            --color-text-sub: #5E5D59;
            --card-bg: #FCFBF8;
            
            --primary: var(--color-green);
            --primary-dark: var(--color-green-dark);
            --bg-body: var(--color-light);
            --text-main: var(--color-dark);
            --text-sub: var(--color-text-sub);
            
            --font-sans: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --nav-height: 75px;
            --nav-height-mobile: 70px;
            
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: var(--font-sans); 
            margin: 0; 
            padding: 0;
            -webkit-font-smoothing: antialiased; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            padding-bottom: var(--nav-height-mobile);
            opacity: 0; 
            transition: opacity 0.3s ease-in-out;
        }
        body.ready { opacity: 1; }

        /* --- NAVIGATION SUPÉRIEURE --- */

        .nav-link:hover, .nav-link.active {
            border-bottom-color: var(--color-dark);
            font-weight: 600;
        }

        .btn-auth-trigger.logged-in {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-auth-trigger.logged-in:hover {
            background: var(--primary);
            color: #ffffff;
        }

        /* Mobile Hamburger Button */

        .mobile-drawer .nav-link {
            font-size: 1rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--color-border);
            width: 100%;
        }

        @media (min-width: 993px) { body { padding-bottom: 0; } }

        /* --- RELEASE PAGE SPECIFIC --- */
        .container { 
            max-width: 900px; margin: 40px auto; padding: 0 20px; 
            width: 100%; box-sizing: border-box; flex: 1;
        }

        .page-header {
            text-align: center; margin-bottom: 40px;
        }
        .page-title {
            font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin: 0 0 6px; line-height: inherit;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .page-sub {
            color: var(--text-sub); font-size: 0.88rem;
        }

        .timeline {
            position: relative;
            padding-left: 20px;
        }
        /* Ligne verticale */
        .timeline::before {
            content: ''; position: absolute; left: 0; top: 10px; bottom: 0;
            width: 2px; background: var(--color-border);
        }

        .release-card {
            background: var(--surface); 
            border: 1px solid var(--color-border); 
            padding: 28px;
            margin-bottom: 30px; 
            box-shadow: var(--shadow);
            position: relative; 
            margin-left: 20px;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .release-card:hover { transform: translateY(-3px); border-color: var(--color-dark); box-shadow: var(--shadow-hover); }
        
        /* Point sur la timeline */
        .release-card::before {
            content: ''; position: absolute; left: -27px; top: 32px;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--color-dark); border: 4px solid var(--bg-body);
        }

        .release-meta {
            display: flex; align-items: center; gap: 10px; margin-bottom: 15px;
        }

        .release-date {
            background: var(--color-sand); color: var(--color-dark);
            border: 1px solid var(--color-border);
            font-weight: 700; font-size: 0.72rem; padding: 4px 10px; text-transform: uppercase; letter-spacing: 0.05em;
        }

        .version-badge {
            background: var(--color-dark); color: var(--color-light);
            font-family: var(--font-mono); 
            font-size: 0.72rem; font-weight: 600; padding: 4px 10px; letter-spacing: 0.05em;
        }

        /* Plusieurs versions dans la même carte (même mois) */
        .release-entry + .release-entry { border-top: 1px dashed var(--color-border); margin-top: 22px; padding-top: 22px; }
        .release-entry-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .release-day, .release-count { font-size: 0.72rem; font-weight: 600; color: var(--color-text-sub); letter-spacing: 0.05em; text-transform: uppercase; }

        .release-title {
            font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.03em;
        }
        .release-content {
            font-size: 0.88rem; color: var(--text-sub); line-height: 1.6;
        }
        .release-content strong { color: var(--text-main); }
        .release-content ul { padding-left: 20px; margin: 10px 0; }
        .release-content li { margin-bottom: 6px; }

        .alert-box {
            background: var(--color-gold-light); 
            border-left: 4px solid var(--color-gold);
            border: 1px solid var(--color-border);
            border-left-width: 4px;
            padding: 16px; margin-top: 18px;
            color: var(--color-dark); font-size: 0.82rem; line-height: 1.6;
        }
        .alert-title { font-weight: 700; display: block; margin-bottom: 6px; color: var(--color-dark); text-transform: uppercase; letter-spacing: 0.05em; }

        /* MODALS & INPUTS */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(26, 26, 26, 0.7); 
            z-index: 3000; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(4px); 
            padding: 1rem;
        }
        .modal-content { 
            background: var(--card-bg); 
            border: 1px solid var(--color-border);
            width: 100%; 
            max-width: 440px; 
            padding: 2.2rem; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); 
            max-height: 90vh; 
            overflow-y: auto; 
            position: relative; 
        }
        .btn-save { 
            width: 100%; 
            background: var(--color-dark); 
            color: var(--color-light); 
            border: 1px solid var(--color-dark); 
            padding: 12px; 
            font-family: var(--font-sans);
            font-weight: 600; 
            font-size: 0.82rem; 
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer; 
            margin-top: 15px; 
            transition: all 0.25s ease; 
        }
        .btn-save:hover { background: transparent; color: var(--color-dark); }
        .btn-cancel { 
            width: 100%; 
            background: transparent; 
            border: none; 
            color: var(--color-text-sub); 
            padding: 10px; 
            cursor: pointer; 
            margin-top: 5px; 
            font-size: 0.78rem; 
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: underline;
        }
        .btn-cancel:hover { color: var(--color-red); }

        input { 
            width: 100%; padding: 10px 12px; border: 1px solid var(--color-border); 
            font-family: var(--font-sans); font-size: 0.85rem; box-sizing: border-box; background: var(--surface);
            color: var(--color-dark); outline: none; transition: border-color 0.25s ease; margin-bottom: 10px; 
        }
        input:focus { border-color: var(--color-dark); }

        .auth-title { text-align: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: var(--color-dark); }
        .auth-separator { margin: 1.2rem 0; font-size: 0.75rem; letter-spacing: 0.15em; color: var(--color-text-sub); text-align: center; }
    </style>
</head>

                <button type="button" class="btn-cancel" style="display:inline; padding:0; margin:0; width:auto; font-size:11px;" onclick="window.handleResetPassword()" data-t="btnForgot">Mot de passe oublié ?</button>

            <div class="auth-separator">OU</div>
            
            <button type="button" class="btn-save" onclick="window.handleGoogleLogin()" style="background:var(--surface); color:var(--text-main); border:1px solid var(--color-border); margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px;">

            </button>

            <button type="button" class="btn-save" onclick="window.handleRegister()" style="background:var(--surface); color:var(--text-main); border:1px solid var(--color-border);" data-t="btnRegister">
                Créer un compte (Email)
            </button>
            
            <button type="button" class="btn-cancel" onclick="window.toggleAuthModal()" data-t="btnCancel">Annuler</button>
        </form>
    </dialog>

    <script type="module">
        import { app } from './assets/firebase.js';
        import { withCommon, syncLangToggle } from './assets/i18n.js';
        import { auth, setupAuthModal, updateAuthButtons, updateAuthLabel } from './assets/auth.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ================================================================
        // NOTES DE MISE À JOUR — la plus récente en premier.
        // Pour publier une nouvelle version : ajouter UN bloc en tête de la liste.
        // UNE seule version par mois : une nouvelle évolution le même mois met à jour l'entrée du mois
        // (contenu fusionné + numéro de version augmenté) au lieu d'ajouter un bloc. content : HTML autorisé.
        // ================================================================
        const RELEASES = [
            {
                version: "v2.13.2",
                month: "2026-11",
                title: {
                    fr: "Harry Potter, une page par figurine, 5 langues, appli installable, bourse aux échanges et Collection, Stats & partage repensés",
                    en: "Harry Potter, a page for every figure, 5 languages, installable app, trading board and redesigned Collection, Stats & sharing"
                },
                content: {
                    fr: "<strong>Nouveautés :</strong><ul><li><strong>🔍 Une page pour chaque figurine</strong> (349 pages) : grande photo, cote actuelle et sa tendance, courbe sur 6 mois, rareté, toute la série en images et un bouton pour l'ajouter à votre collection. Passez d'une figurine à la suivante avec les boutons ou les flèches du clavier, avec une transition fluide. On y arrive depuis la page Marché ou depuis la fiche d'une figurine dans votre Collection (« Voir sa fiche publique »), et chaque page se partage avec son propre lien. Dans la Collection, le bouton ↗ de chaque carte ouvre sa page, et depuis la page, « Voir la série dans ma collection » ou le fil d'Ariane (Accueil › Collection › Série) ramènent à la Collection ouverte sur la bonne série</li><li><strong>🌍 5 langues</strong> : HRNtrack existe maintenant en espagnol, en allemand et en chinois, en plus du français et de l'anglais. Choisissez votre langue dans le menu (FR, EN, ES, DE, 中文)</li><li><strong>📈 Page Marché</strong> : les cotes de toutes les figurines, les plus chères, les plus fortes hausses et baisses sur 6 mois, les séries, les plus rares et les plus recherchées, avec une recherche</li><li><strong>🔎 Recherche partout</strong> : la loupe du menu (ou Ctrl + K) trouve n'importe quelle figurine et ouvre directement sa fiche</li><li><strong>🗓️ Sorties à venir</strong> : un calendrier des prochaines séries annoncées en haut de la page Nouveautés</li><li><strong>🎯 Mes objectifs</strong> (Statistiques) : un budget mensuel et des séries à finir avant une date, avec leur progression</li><li><strong>💎 Rareté</strong> : la part des collectionneurs qui possèdent chaque figurine (dans sa fiche), un tri « les plus rares d'abord » et vos figurines les plus rares dans les Statistiques</li><li><strong>⭐ Priorités de wishlist</strong> : haute, moyenne ou basse pour chaque figurine recherchée, avec un tri et le budget par priorité</li><li><strong>🧾 Coût pour finir</strong> : le montant estimé pour compléter chaque série et toute votre wishlist, selon les cotes</li><li><strong>📜 Journal de collection</strong> (page Statistiques) : vos achats mois par mois, par exemple « mars 2026 : 3 Lost Paradise », avec le nombre de figurines, le montant dépensé et la liste illustrée de chaque mois</li><li><strong>🔔 Alertes nouveautés</strong> (page Nouveautés) : recevez une notification sur votre téléphone ou ordinateur quand de nouvelles figurines arrivent dans le catalogue (sur iPhone, depuis l'appli installée)</li><li><strong>🔁 Bourse aux échanges</strong> (nouvelle page Échanges) : HRNtrack compare vos doublons avec la wishlist des autres collectionneurs, et inversement. Les échanges réciproques et les figurines de votre wishlist apparaissent en premier, avec le contact de chacun. Participation libre, à activer dans Mon compte, avec un champ par réseau (Instagram, TikTok, Discord, Facebook, X, Vinted) : chaque réseau renseigné apparaît avec son logo sur votre fiche, et un clic ouvre le profil ou copie le pseudo</li><li><strong>📈 Évolution de la valeur</strong> (page Statistiques) : courbe de la valeur estimée de votre collection sur 6 mois face à ce que vous avez dépensé, et tendance à collection égale</li><li><strong>🔒 Collection privée</strong> : un interrupteur dans Mon compte désactive votre lien de partage</li><li><strong>HRNtrack s'installe comme une appli</strong> : bouton « 📲 Installer l'appli » dans le menu mobile et en bas de page (sur iPhone : Partager → Sur l'écran d'accueil). Icône sur l'écran d'accueil, ouverture en plein écran, raccourcis vers la Collection, les Nouveautés et les Stats</li><li><strong>Mode hors ligne</strong> : les pages et votre collection déjà ouvertes restent consultables sans réseau, et les modifications sont envoyées au retour de la connexion</li><li><strong>Nouvelle story Instagram</strong> (page Statistiques) : votre pseudo, votre rang, la complétion du catalogue, vos chiffres clés et vos 3 pépites en image. Aperçu avant export, option pour masquer la valeur et les prix, et bouton Partager sur mobile</li><li><strong>Page de partage repensée</strong> : rang du collectionneur, progression globale et par série, doublons à échanger, recherche et filtres, en mode clair comme en sombre</li><li><strong>Série Harry Potter</strong> (14 figurines dont 2 secrètes : Mandrake et Harry Potter Special Edition) et 4 <strong>éditions spéciales</strong> : UV WWR Square Garden Patrol, UV WWR Lucky Bertie, Snowman Figurine, Kodak Click Figure</li><li><strong>Mode sombre</strong> sur tout le site : il suit le réglage de votre appareil, et le bouton lune / soleil permet de choisir</li><li><strong>Page Statistiques repensée</strong> : complétion du catalogue, valeur estimée selon les cotes, prochains objectifs (les figurines qu'il vous manque pour finir vos séries), progression de chaque série, dépenses des 12 derniers mois, état de vos figurines</li><li><strong>Page Collection modernisée</strong> : recherche instantanée qui ignore les accents et accepte plusieurs mots (nom, série ou ID), nouveaux filtres Manquantes / Doublons / Secrets avec leur nombre, tri par cote, et un résumé de votre collection identique à celui des Statistiques</li><li><strong>Évolution des cotes</strong> : la fiche de chaque figurine affiche un graphique de sa cote sur les 6 derniers mois, avec la tendance en %</li><li><strong>Nouveaux badges</strong> : un badge illustré pour chaque série (dont Harry Potter ⚡), plus « Négociant » (5 doublons) et « Centurion » (100 figurines)</li><li>Compteur de collectionneurs mis à jour automatiquement sur l'accueil</li></ul><strong>Améliorations :</strong><ul><li><strong>Prix en dollars en anglais</strong> : quand le site est en anglais, les cotes, la valeur de la collection, les dépenses et le budget s'affichent en dollars américains, au taux du jour de la BCE. Vos données restent enregistrées en euros, et le prix payé d'une figurine garde la devise dans laquelle vous l'avez saisi</li><li><strong>Accessibilité</strong> : un lien « Aller au contenu » apparaît à la première pression sur Tab, et les cartes de la Collection s'utilisent entièrement au clavier (Entrée pour ouvrir, Tab pour la page de la figurine)</li><li><strong>Liens plus beaux</strong> : un lien HRNtrack collé sur Discord, WhatsApp, Facebook ou X affiche maintenant une grande image de présentation, et chaque page a un titre et une description plus clairs dans Google</li><li><strong>Fenêtres plus pratiques</strong> : connexion, fiche d'une figurine et story se ferment avec Échap ou un clic à côté, gardent le clavier à l'intérieur et affichent leurs messages directement dedans</li><li><strong>Connexion plus rapide</strong> : votre navigateur ou gestionnaire de mots de passe peut maintenant remplir et retenir votre email et votre mot de passe</li><li><strong>Mode clair / sombre</strong> : revenir au même thème que votre appareil le fait de nouveau suivre automatiquement</li><li><strong>Accueil repensé</strong> : les 6 grandes fonctions du site (Collection, Statistiques, Bourse aux échanges, Nouveautés, Partage & story, Appli) présentées avec un lien direct vers chacune</li><li><strong>Messages plus agréables</strong> : confirmations et erreurs s'affichent en bas de la page au lieu des fenêtres du navigateur</li><li><strong>Plus rapide et plus discret</strong> : les polices et les logos sont maintenant servis par HRNtrack lui-même, sans passer par des services externes</li><li><strong>Confidentialité du partage</strong> : votre lien ne montre que vos figurines, votre pseudo et votre avatar ; vos prix, dates d'achat et notes restent privés</li><li><strong>Cookies</strong> : un lien « Gérer les cookies » en bas de chaque page permet de changer d'avis à tout moment, et votre choix vous est redemandé au bout de 13 mois</li><li><strong>Confidentialité</strong> : la page Mentions légales a été réécrite, avec plus de clarté sur vos données, combien de temps elles sont gardées et vos droits</li><li>23 images d'accessoires et d'éditions spéciales sans fond blanc, et deux fois plus légères</li><li>Pages plus rapides (photo d'accueil 40× plus légère), zoom autorisé sur mobile, navigation complète au clavier</li><li>Cotes plus fiables (prix médian, erreurs de saisie écartées)</li><li>Cette page regroupe désormais les nouveautés de chaque mois en une seule version</li></ul><strong>Corrections :</strong><ul><li>Catalogue : « Freedom Island Plush Doll Pendant » affiche enfin sa vraie photo (et non celle de Ceramic Feather), et « Hiding Behind You » est bien orthographié</li><li>Page Collection : les boutons de recherche et de mode clair / sombre ont la même taille que sur les autres pages</li><li>Votre pseudo et votre avatar ne sont plus effacés quand vous enregistrez votre collection</li><li>La devise de vos achats est conservée quand vous ajoutez une figurine depuis les Nouveautés</li><li>Collection : le tri par nom fonctionne, la « valeur estimée » affiche bien la cote (et non le montant dépensé), et les cotes s'affichent en euros dans toutes les langues</li><li>Les nouvelles figurines s'affichent tout de suite après une mise à jour du catalogue</li><li>Statistiques : achats en dollars, livres, etc. convertis en euros, et figurines sans quantité saisie bien comptées</li><li>Statistiques : la description d'un badge s'affiche maintenant par-dessus les autres badges, bien lisible, et s'ouvre aussi d'un appui sur mobile</li></ul>",
                    en: "<strong>What's new:</strong><ul><li><strong>🔍 A page for every figure</strong> (349 pages): big picture, current market value and trend, 6-month chart, rarity, the whole series with pictures and a button to add it to your collection. Move to the next figure with the buttons or the keyboard arrows, with a smooth transition. Open them from the Market page or from a figure in your Collection (“See its public page”), and share each one with its own link. In your Collection, the ↗ button on each card opens its page, and from the page, “See the series in my collection” or the breadcrumb (Home › Collection › Series) takes you back to your Collection, already filtered on that series</li><li><strong>🌍 5 languages</strong>: HRNtrack is now available in Spanish, German and Chinese, as well as French and English. Pick your language in the menu (FR, EN, ES, DE, 中文)</li><li><strong>📈 Market page</strong>: every figure's value, the most valuable, the biggest rises and drops over 6 months, series, the rarest and the most wanted, with a search</li><li><strong>🔎 Search everywhere</strong>: the menu magnifier (or Ctrl + K) finds any figure and opens its card</li><li><strong>🗓️ Upcoming releases</strong>: a calendar of announced series at the top of the New releases page</li><li><strong>🎯 My goals</strong> (Statistics): a monthly budget and series to finish by a date, with their progress</li><li><strong>💎 Rarity</strong>: the share of collectors who own each figure (in its card), a “rarest first” sort and your rarest figures in Statistics</li><li><strong>⭐ Wishlist priorities</strong>: high, medium or low for each wanted figure, with sorting and a budget per priority</li><li><strong>🧾 Cost to finish</strong>: the estimated amount to complete each series and your whole wishlist, at market value</li><li><strong>📜 Collection journal</strong> (Statistics page): your purchases month by month, e.g. “March 2026: 3 Lost Paradise”, with the number of figures, the amount spent and an illustrated list for each month</li><li><strong>🔔 New release alerts</strong> (New releases page): get a notification on your phone or computer when new figures arrive in the catalog (on iPhone, from the installed app)</li><li><strong>🔁 Trading board</strong> (new Trading page): HRNtrack matches your duplicates with other collectors' wishlists, and the other way round. Two-way trades and figures from your wishlist come first, with each collector's contact. Opt in from My Account, with one field per network (Instagram, TikTok, Discord, Facebook, X, Vinted): each network you fill in shows with its logo on your card, and a click opens the profile or copies the username</li><li><strong>📈 Value over time</strong> (Statistics page): your collection's estimated value over 6 months compared with what you spent, plus the trend for the same figures</li><li><strong>🔒 Private collection</strong>: a switch in My Account turns off your share link</li><li><strong>Install HRNtrack as an app</strong>: “📲 Install the app” button in the mobile menu and at the bottom of the page (on iPhone: Share → Add to Home Screen). Home screen icon, full-screen launch, shortcuts to Collection, New releases and Stats</li><li><strong>Offline mode</strong>: pages and your collection you already opened stay available without a connection, and changes are sent when you are back online</li><li><strong>New Instagram story</strong> (Statistics page): your nickname, rank, catalog completion, key figures and your top 3 figures with pictures. Preview before export, an option to hide value and prices, and a Share button on mobile</li><li><strong>Redesigned share page</strong>: collector rank, overall and per-series progress, duplicates for trade, search and filters, in light and dark mode</li><li><strong>Harry Potter Series</strong> (14 figures including 2 secrets: Mandrake and Harry Potter Special Edition) and 4 <strong>special editions</strong>: UV WWR Square Garden Patrol, UV WWR Lucky Bertie, Snowman Figurine, Kodak Click Figure</li><li><strong>Dark mode</strong> across the site: it follows your device setting, and the moon / sun button lets you choose</li><li><strong>Redesigned Statistics page</strong>: catalog completion, estimated value from market prices, next goals (the figures you need to finish your series), progress for every series, spending over the last 12 months, condition of your figures</li><li><strong>Modernized Collection page</strong>: instant search that ignores accents and accepts several words (name, series or ID), new Missing / Duplicates / Secrets filters with counts, sort by market value, and a collection summary matching the Statistics page</li><li><strong>Market value trends</strong>: each figure's card now shows a chart of its market value over the last 6 months, with the trend in %</li><li><strong>New badges</strong>: an illustrated badge for every series (including Harry Potter ⚡), plus \"Trader\" (5 duplicates) and \"Centurion\" (100 figures)</li><li>Collector counter on the home page now updates automatically</li></ul><strong>Improvements:</strong><ul><li><strong>Prices in US dollars</strong>: with the site in English, market values, collection value, spending and budget are shown in US dollars at the ECB daily rate. Your data is still stored in euros, and the price you paid for a figure keeps the currency you entered it in</li><li><strong>Accessibility</strong>: a “Skip to content” link appears on the first Tab press, and Collection cards work fully with the keyboard (Enter to open, Tab to the figure page)</li><li><strong>Nicer links</strong>: an HRNtrack link pasted in Discord, WhatsApp, Facebook or X now shows a large preview image, and every page has a clearer title and description in Google</li><li><strong>Better windows</strong>: sign-in, figure card and story close with Esc or a click outside, keep the keyboard inside and show their messages right in the window</li><li><strong>Faster sign-in</strong>: your browser or password manager can now fill in and remember your email and password</li><li><strong>Light / dark mode</strong>: switching back to your device's theme makes the site follow it automatically again</li><li><strong>Redesigned home page</strong>: the site's 6 main features (Collection, Statistics, Trading board, New releases, Sharing & story, App) with a direct link to each</li><li><strong>Nicer messages</strong>: confirmations and errors now appear at the bottom of the page instead of browser pop-ups</li><li><strong>Faster and more private</strong>: fonts and logos are now served by HRNtrack itself, without third-party services</li><li><strong>Sharing privacy</strong>: your link only shows your figures, nickname and avatar; your prices, purchase dates and notes stay private</li><li><strong>Cookies</strong>: a “Manage cookies” link at the bottom of every page lets you change your mind at any time, and you are asked again after 13 months</li><li><strong>Privacy</strong>: the Legal Notice page has been rewritten to explain more clearly what data is kept, for how long, and your rights</li><li>23 accessory and special edition images without a white background, and half the size</li><li>Faster pages (home photo 40× lighter), pinch-zoom on mobile, full keyboard navigation</li><li>More reliable market values (median price, typos filtered out)</li><li>This page now groups each month's changes into a single version</li></ul><strong>Fixes:</strong><ul><li>Catalog: “Freedom Island Plush Doll Pendant” now shows its own picture (not Ceramic Feather’s), and “Hiding Behind You” is spelled correctly</li><li>Collection page: the search and light / dark mode buttons are the same size as on the other pages</li><li>Your nickname and avatar are no longer erased when saving your collection</li><li>Your purchase currency is kept when adding a figure from New Releases</li><li>Collection: sorting by name works, the “estimated value” now shows market value (not the amount spent), and market values are shown in euros in every language</li><li>New figures show up right after a catalog update</li><li>Statistics: purchases in dollars, pounds, etc. converted to euros, and figures without a quantity are counted</li><li>Statistics: a badge's description now appears on top of the other badges, clearly readable, and also opens with a tap on mobile</li></ul>"
                }
            },

                month: "2026-03",
                title: {
                    fr: "Collection optimisée & Dollar canadien",
                    en: "Collection page optimization & Canadian Dollar"
                },
                content: {
                    fr: "<p><strong>Ajout du Dollar Canadien (CAD)</strong></p>Vous l'avez demandé ! Le <strong>Dollar Canadien (CAD / CA$)</strong> est désormais disponible dans le choix des devises pour vos achats. Les cotes et les statistiques prennent désormais correctement en compte cette monnaie.<p><strong>Optimisation de la page Collection</strong></p><ul><li>Refonte complète du système de graphiques : affichage des vraies données historiques de la communauté.</li><li>Meilleure gestion des affichages lorsqu'il y a peu ou pas d'historique (ex: 1 seule donnée).</li><li>Améliorations esthétiques et responsive (PC/Mobile) de la pop-up.</li></ul>",
                    en: "<p><strong>Canadian Dollar (CAD) Support</strong></p>You asked for it! The <strong>Canadian Dollar (CAD / CA$)</strong> is now available in the currency selection for your purchases. Market values and statistics now properly support this currency.<p><strong>Collection Page Optimization</strong></p><ul><li>Complete overhaul of the chart system: displaying real community historical data.</li><li>Better fallback display when there is little to no history (e.g., only 1 data point).</li><li>Aesthetic and responsive (PC/Mobile) improvements to the pop-up modal.</li></ul>"

                content: {
                    fr: "Ajout de 3 nouvelles figurines <strong>Special Edition / Blister</strong> au tracker :<ul><li>Freedom Island Plus</li><li>Well Pharmacy</li><li>Elephant in the room marbed</li></ul>",

            {
                version: "v1.1.2",
                month: "2026-01",
                title: {
                    fr: "Cotes communautaires, profils & nouveautés",
                    en: "Community prices, profiles & new arrivals"
                },
                content: {
                    fr: "<p><strong>New Arrivals</strong></p>3 nouvelles \"Special Blind Box\" sont disponibles sur le tracker ! C'est l'heure de mettre à jour votre collection ou votre wishlist.<ul><li>Wish List Pendant</li><li>Good Health</li><li>Luck on the Way</li></ul><p><strong>Les Cotes Communautaires sont actives !</strong></p><p>Nous avons déployé un nouvel algorithme qui calcule la valeur marché (Cote) de chaque figurine en se basant sur les prix d'achat réels de toute la communauté.</p><p><strong>POURQUOI C'EST IMPORTANT ?</strong><br>Pour que ce système fonctionne et que votre \"Deal Score\" (Indicateur de bonne affaire) soit juste, nous avons besoin de données précises.</p><div class=\"alert-box\"><span class=\"alert-title\">⚠️ LA DEVISE (CURRENCY) EST CRUCIALE !</span>Si vous avez acheté une figurine en Dollars ($) ou en Livres (£), merci de bien sélectionner la devise correspondante.<br><em>Exemple : Si vous notez \"20\" en prix d'achat pour du $USD mais que vous laissez la devise sur \"€\" (EUR), cela fausse les statistiques de tout le monde !</em><br><br><strong>Action requise :</strong><ul style=\"margin-bottom:0;\"><li>Allez dans votre Collection.</li><li>Vérifiez vos prix d'achat.</li><li>Assurez-vous que le champ Devise correspond bien à ce que vous avez payé.</li></ul></div><p><strong>Fonctionnalités Majeures</strong></p><p><strong>Suivi des Cotes & Graphiques :</strong> Fini les fichiers Excel ! Consultez la Cote Communautaire estimée pour chaque figurine et visualisez l'Historique des Prix (tendance sur 6 mois) directement sur la fiche.</p><p><strong>Personnalisez votre Profil :</strong> C'est votre espace ! Ajoutez désormais un Pseudo et une Photo de Profil pour rendre votre page de collection unique.</p><p><strong>Partage de Collection :</strong> Générez un lien public unique en un clic. Partagez votre vitrine personnalisée à vos amis (même s'ils n'ont pas de compte) !</p><p><strong>Système de Trophées :</strong> Votre passion est récompensée ! Débloquez des badges exclusifs comme Chasseur, Investisseur, Complétiste et bien d'autres.</p><p><strong>Mise à jour Base de Données & Ranks</strong></p><ul><li>Ajout de la figurine <strong>Luck on the Way (Special Edition)</strong>.</li><li>Mise à jour majeure du système de <strong>Rank</strong> (plus de paliers : Amateur, Legend...).</li><li>Amélioration du système de badges.</li></ul>",
                    en: "<p><strong>New Arrivals</strong></p>3 new \"Special Blind Boxes\" are available on the tracker! Time to update your collection or wishlist.<ul><li>Wish List Pendant</li><li>Good Health</li><li>Luck on the Way</li></ul><p><strong>Community Prices are Live!</strong></p><p>We deployed a new algorithm calculating the market value of each figure based on real purchase prices from the community.</p><p><strong>WHY IS THIS IMPORTANT?</strong><br>For this system to work and your \"Deal Score\" to be accurate, we need precise data.</p><div class=\"alert-box\"><span class=\"alert-title\">⚠️ CURRENCY IS CRUCIAL!</span>If you bought a figure in Dollars ($) or Pounds (£), please select the corresponding currency.<br><em>Example: If you input \"20\" as purchase price for $USD but leave the currency on \"€\" (EUR), it skews stats for everyone!</em><br><br><strong>Action required:</strong><ul style=\"margin-bottom:0;\"><li>Go to your Collection.</li><li>Check your purchase prices.</li><li>Ensure the Currency field matches what you paid.</li></ul></div><p><strong>Major Features</strong></p><p><strong>Market Trends & Charts:</strong> No more Excel files! Check the estimated Community Value for each figure and view Price History (6-month trend) directly on the card.</p><p><strong>Customize your Profile:</strong> It's your space! Add a Nickname and Profile Picture to make your collection page unique.</p><p><strong>Collection Sharing:</strong> Generate a unique public link in one click. Share your personalized showcase with friends (even if they don't have an account)!</p><p><strong>Trophy System:</strong> Your passion is rewarded! Unlock exclusive badges like Hunter, Investor, Completionist, and many more.</p><p><strong>Database & Rank Update</strong></p><ul><li>Added figure <strong>Luck on the Way (Special Edition)</strong>.</li><li>Major update to the <strong>Rank</strong> system (new tiers: Amateur, Legend...).</li><li>Badge system improvement.</li></ul>"
                }
            }
        ];

        const translations = withCommon({
            fr: {                pageTitle: "Notes de Mise à Jour", pageSub: "L'historique des nouveautés et améliorations."                },            en: { pageTitle: "Release Notes", pageSub: "History of updates and improvements." }        });

        let currentLang = localStorage.getItem('HRN_LANG') || 'fr';
        
        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const pick = (v) => (v && typeof v === 'object') ? (v[currentLang] || v.en || v.fr) : v;   // notes des versions : anglais pour es / de / zh

        const monthLabel = (ym) => {
            const [y, m] = ym.split('-').map(Number);
            const s = new Date(y, m - 1, 1).toLocaleDateString((window.HRN_LOCALES[currentLang] || 'fr-FR'), { month: 'long', year: 'numeric' });
            return s.charAt(0).toUpperCase() + s.slice(1);
        };

        // Une carte par mois : les versions publiées le même mois sont regroupées
        function renderReleases() {
            const root = document.getElementById('timeline');
            if (!root) return;
            const groups = [];
            for (const r of RELEASES) {
                const last = groups[groups.length - 1];
                if (last && last.month === r.month) last.items.push(r);
                else groups.push({ month: r.month, items: [r] });
            }
            const countLabel = (n) => n > 1 ? `<span class="release-count">${n} ${currentLang === 'fr' ? 'mises à jour' : 'updates'}</span>` : '';
            root.innerHTML = groups.map(g => `
            <div class="release-card">
                <div class="release-meta">
                    <span class="release-date">${esc(monthLabel(g.month))}</span>
                    ${countLabel(g.items.length)}
                </div>
                ${g.items.map(r => `
                <div class="release-entry">
                    <div class="release-entry-head">
                        <span class="version-badge">${esc(r.version)}</span>
                        ${r.day ? `<span class="release-day">${String(r.day).padStart(2, '0')}/${esc(g.month.slice(5))}</span>` : ''}
                    </div>
                    <div class="release-title">${esc(pick(r.title))}</div>
                    <div class="release-content">${pick(r.content)}</div>
                </div>`).join('')}
            </div>`).join('');
        }

        function updateUIText() {
            syncLangToggle(currentLang);
            renderReleases();
            
            const tr = translations[currentLang];
            document.querySelectorAll('[data-t]').forEach(el => { 
                const key = el.getAttribute('data-t'); 
                if(tr[key]) el.innerHTML = tr[key]; 
            });
            
            updateAuthLabel(tr);
        }

        window.toggleLanguage = () => {
            currentLang = (currentLang === 'fr') ? 'en' : 'fr';
            localStorage.setItem('HRN_LANG', currentLang);
            updateUIText();
        };

        setupAuthModal(() => currentLang);

        window.onclick = function(event) { if (event.target.classList.contains('modal-overlay')) { event.target.close ? event.target.close() : (event.target.style.display = "none"); } }

        onAuthStateChanged(auth, (user) => {
            updateUIText();
            updateAuthButtons(!!user);
            document.body.classList.add('ready');
        });

        fetch('footer.html')
            .then(r=>r.text())
            .then(d=>{
                document.getElementById('footer-placeholder').innerHTML=d;
                if(window.updateUIText) window.updateUIText();
                if(window.initCookieLogic) window.initCookieLogic();
            })
            .catch(error => console.error('Erreur Footer:', error));
    </script>
</body>
</html>
