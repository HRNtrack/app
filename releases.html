<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script src="assets/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRNtrack - Mises à jour</title>
    <link rel="icon" type="image/vnd.icon" href="https://i.postimg.cc/pLqpbbHb/IMG-0226f.png">
    
    <!-- Typographies Poppins & JetBrains Mono -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/common.css">
    
    <style>
        :root {
            --color-dark: #1A1A1A;
            --color-light: #F5F5F0;
            --color-sand: #EBE7DF;
            --color-border: #D8D2C5;
            --color-gold: #C6A875;
            --color-gold-light: #F9F5EB;
            --color-red: #C0392B; 
            --color-green: #6A8C47;
            --color-green-dark: #557235;
            --color-text-sub: #5E5D59;
            --card-bg: #FCFBF8;
            
            --primary: var(--color-green);
            --primary-dark: var(--color-green-dark);
            --bg-body: var(--color-light);
            --text-main: var(--color-dark);
            --text-sub: var(--color-text-sub);
            
            --font-sans: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --nav-height: 75px;
            --nav-height-mobile: 70px;
            
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: var(--font-sans); 
            margin: 0; 
            padding: 0;
            -webkit-font-smoothing: antialiased; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            padding-bottom: var(--nav-height-mobile);
            opacity: 0; 
            transition: opacity 0.3s ease-in-out;
        }
        body.ready { opacity: 1; }

        /* --- NAVIGATION SUPÉRIEURE --- */

        .nav-link:hover, .nav-link.active {
            border-bottom-color: var(--color-dark);
            font-weight: 600;
        }

        .btn-auth-trigger.logged-in {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-auth-trigger.logged-in:hover {
            background: var(--primary);
            color: #ffffff;
        }

        /* Mobile Hamburger Button */

        .mobile-drawer .nav-link {
            font-size: 1rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--color-border);
            width: 100%;
        }

        @media (min-width: 993px) { body { padding-bottom: 0; } }

        /* --- RELEASE PAGE SPECIFIC --- */
        .container { 
            max-width: 900px; margin: 40px auto; padding: 0 20px; 
            width: 100%; box-sizing: border-box; flex: 1;
        }

        .page-header {
            text-align: center; margin-bottom: 40px;
        }
        .page-title {
            font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .page-sub {
            color: var(--text-sub); font-size: 0.88rem;
        }

        .timeline {
            position: relative;
            padding-left: 20px;
        }
        /* Ligne verticale */
        .timeline::before {
            content: ''; position: absolute; left: 0; top: 10px; bottom: 0;
            width: 2px; background: var(--color-border);
        }

        .release-card {
            background: var(--surface); 
            border: 1px solid var(--color-border); 
            padding: 28px;
            margin-bottom: 30px; 
            box-shadow: var(--shadow);
            position: relative; 
            margin-left: 20px;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .release-card:hover { transform: translateY(-3px); border-color: var(--color-dark); box-shadow: var(--shadow-hover); }
        
        /* Point sur la timeline */
        .release-card::before {
            content: ''; position: absolute; left: -27px; top: 32px;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--color-dark); border: 4px solid var(--bg-body);
        }

        .release-meta {
            display: flex; align-items: center; gap: 10px; margin-bottom: 15px;
        }

        .release-date {
            background: var(--color-sand); color: var(--color-dark);
            border: 1px solid var(--color-border);
            font-weight: 700; font-size: 0.72rem; padding: 4px 10px; text-transform: uppercase; letter-spacing: 0.05em;
        }

        .version-badge {
            background: var(--color-dark); color: var(--color-light);
            font-family: var(--font-mono); 
            font-size: 0.72rem; font-weight: 600; padding: 4px 10px; letter-spacing: 0.05em;
        }

        .release-title {
            font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.03em;
        }
        .release-content {
            font-size: 0.88rem; color: var(--text-sub); line-height: 1.6;
        }
        .release-content strong { color: var(--text-main); }
        .release-content ul { padding-left: 20px; margin: 10px 0; }
        .release-content li { margin-bottom: 6px; }

        .alert-box {
            background: var(--color-gold-light); 
            border-left: 4px solid var(--color-gold);
            border: 1px solid var(--color-border);
            border-left-width: 4px;
            padding: 16px; margin-top: 18px;
            color: var(--color-dark); font-size: 0.82rem; line-height: 1.6;
        }
        .alert-title { font-weight: 700; display: block; margin-bottom: 6px; color: var(--color-dark); text-transform: uppercase; letter-spacing: 0.05em; }

        /* MODALS & INPUTS */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(26, 26, 26, 0.7); 
            z-index: 3000; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(4px); 
            padding: 1rem;
        }
        .modal-content { 
            background: var(--card-bg); 
            border: 1px solid var(--color-border);
            width: 100%; 
            max-width: 440px; 
            padding: 2.2rem; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); 
            max-height: 90vh; 
            overflow-y: auto; 
            position: relative; 
        }
        .btn-save { 
            width: 100%; 
            background: var(--color-dark); 
            color: var(--color-light); 
            border: 1px solid var(--color-dark); 
            padding: 12px; 
            font-family: var(--font-sans);
            font-weight: 600; 
            font-size: 0.82rem; 
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer; 
            margin-top: 15px; 
            transition: all 0.25s ease; 
        }
        .btn-save:hover { background: transparent; color: var(--color-dark); }
        .btn-cancel { 
            width: 100%; 
            background: transparent; 
            border: none; 
            color: var(--color-text-sub); 
            padding: 10px; 
            cursor: pointer; 
            margin-top: 5px; 
            font-size: 0.78rem; 
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: underline;
        }
        .btn-cancel:hover { color: var(--color-red); }

        input { 
            width: 100%; padding: 10px 12px; border: 1px solid var(--color-border); 
            font-family: var(--font-sans); font-size: 0.85rem; box-sizing: border-box; background: var(--surface);
            color: var(--color-dark); outline: none; transition: border-color 0.25s ease; margin-bottom: 10px; 
        }
        input:focus { border-color: var(--color-dark); }

        .auth-title { text-align: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: var(--color-dark); }
        .auth-separator { margin: 1.2rem 0; font-size: 0.75rem; letter-spacing: 0.15em; color: var(--color-text-sub); text-align: center; }
    </style>
</head>
<body>

    <script src="assets/header.js"></script>

    <div class="container">
        <div class="page-header">
            <div class="page-title" data-t="pageTitle">Notes de Mise à Jour</div>
            <div class="page-sub" data-t="pageSub">L'historique des nouveautés et améliorations.</div>
        </div>

        <!-- Cartes générées depuis RELEASES (voir le script plus bas) -->
        <div class="timeline" id="timeline"></div>

    </div>

    <!-- MODAL D'AUTHENTIFICATION -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content" style="text-align:center; max-width:440px;">
            <div class="auth-title" data-t="authLogin">Connexion</div>
            <p style="color:var(--color-text-sub); font-size:13px; margin-bottom:20px;" data-t="authDesc">
                Sauvegardez votre collection dans le cloud.
            </p>
            
            <input type="email" id="auth-email" placeholder="Email" style="margin-bottom:12px;">
            <input type="password" id="auth-pass" placeholder="Mot de passe" style="margin-bottom:12px;">
            
            <div style="text-align: right; margin-bottom: 15px;">
                <button class="btn-cancel" style="display:inline; padding:0; margin:0; width:auto; font-size:11px;" onclick="window.handleResetPassword()" data-t="btnForgot">Mot de passe oublié ?</button>
            </div>

            <button class="btn-save" onclick="window.handleLogin()" style="background:var(--primary); border-color:var(--primary);" data-t="btnLogin">Se connecter</button>
            
            <div class="auth-separator">OU</div>
            
            <button class="btn-save" onclick="window.handleGoogleLogin()" style="background:var(--surface); color:var(--text-main); border:1px solid var(--color-border); margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:18px; height:18px;" alt="Google">
                <span data-t="btnGoogle">Continuer avec Google</span>
            </button>

            <button class="btn-save" onclick="window.handleRegister()" style="background:var(--surface); color:var(--text-main); border:1px solid var(--color-border);" data-t="btnRegister">
                Créer un compte (Email)
            </button>
            
            <button class="btn-cancel" onclick="window.toggleAuthModal()" data-t="btnCancel">Annuler</button>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="assets/site.js"></script>

    <script type="module">
        import { app } from './assets/firebase.js';
        import { withCommon, syncLangToggle } from './assets/i18n.js';
        import { auth, setupAuthModal, updateAuthButtons, updateAuthLabel } from './assets/auth.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ================================================================
        // NOTES DE MISE À JOUR — la plus récente en premier.
        // Pour publier une nouvelle version : ajouter UN bloc en tête de la liste.
        // date : texte libre, ou { fr: "...", en: "..." }. content : HTML autorisé.
        // ================================================================
        const RELEASES = [
            {
                version: "v2.2.0",
                date: { fr: "Novembre 2026", en: "November 2026" },
                title: {
                    fr: "Mode sombre & Compteur en direct",
                    en: "Dark Mode & Live Counter"
                },
                content: {
                    fr: "<strong>Nouveautés :</strong><ul><li><strong>Mode sombre</strong> sur tout le site : il suit automatiquement le réglage de votre téléphone ou ordinateur, et le bouton lune / soleil en haut de page permet de choisir (votre choix est mémorisé)</li><li><strong>Compteur de collectionneurs</strong> sur l'accueil, désormais mis à jour automatiquement</li></ul><strong>Améliorations :</strong><ul><li>Les nouvelles figurines s'affichent tout de suite après une mise à jour du catalogue, sans rester bloquées par l'ancienne version en mémoire</li><li>Barre de navigation mieux équilibrée sur les écrans de taille moyenne</li></ul>",
                    en: "<strong>What's new:</strong><ul><li><strong>Dark mode</strong> across the whole site: it automatically follows your phone or computer setting, and the moon / sun button at the top lets you choose (your choice is remembered)</li><li><strong>Collector counter</strong> on the home page, now updated automatically</li></ul><strong>Improvements:</strong><ul><li>New figures show up right after a catalog update, without being stuck on the old cached version</li><li>Better balanced navigation bar on medium-sized screens</li></ul>"
                }
            },
            {
                version: "v2.1.0",
                date: "Novembre 2026",
                title: {
                    fr: "Série Harry Potter & Éditions Spéciales",
                    en: "Harry Potter Series & Special Editions"
                },
                content: {
                    fr: "<strong>Nouvelles figurines (18) :</strong><ul><li><strong>Série Harry Potter</strong> (14 figurines dont 2 secrètes : Mandrake et Harry Potter Special Edition)</li><li><strong>Éditions Spéciales</strong> : UV WWR Square Garden Patrol, UV WWR Lucky Bertie, Snowman Figurine, Kodak Click Figure</li></ul><strong>Améliorations du site :</strong><ul><li>Pages plus rapides (photo d'accueil 40× plus légère)</li><li>Zoom autorisé sur mobile et navigation complète au clavier</li><li>Correction : votre pseudo et votre avatar ne sont plus effacés quand vous enregistrez votre collection</li><li>Correction : la devise de vos achats est conservée quand vous ajoutez une figurine depuis les Nouveautés</li><li>Cotes plus fiables (prix médian, erreurs de saisie écartées)</li></ul>",
                    en: "<strong>New figures (18):</strong><ul><li><strong>Harry Potter Series</strong> (14 figures including 2 secrets: Mandrake and Harry Potter Special Edition)</li><li><strong>Special Editions</strong>: UV WWR Square Garden Patrol, UV WWR Lucky Bertie, Snowman Figurine, Kodak Click Figure</li></ul><strong>Website improvements:</strong><ul><li>Faster pages (home photo 40× lighter)</li><li>Pinch-zoom allowed on mobile and full keyboard navigation</li><li>Fix: your nickname and avatar are no longer erased when saving your collection</li><li>Fix: your purchase currency is kept when adding a figure from New Releases</li><li>More reliable values (median price, typos filtered out)</li></ul>"
                }
            },
            {
                version: "v2.0.0",
                date: "Septembre 2026",
                title: {
                    fr: "Refonte v2.0 & Nouvelles Séries After Dark",
                    en: "v2.0 Overhaul & New After Dark Series"
                },
                content: {
                    fr: "Bienvenue sur la version 2.0 d'HRNtrack ! Une refonte graphique complète a été déployée pour offrir un design plus épuré, moderne et élégant.<br><br><strong>Nouvelles Séries Ajoutées (28 figurines) :</strong><ul><li><strong>After Dark Charm</strong> (Série de charmes)</li><li><strong>After Dark Magnet</strong> (Série d'aimants)</li><li><strong>After Dark Pendant</strong> (Série de pendentifs)</li><li><strong>Accessoires & Éditions Spéciales</strong> (Mugs After Dark Black & White, Lampes, Diffuseur, The Hundreds Figure & Pendant, Dino Plush)</li></ul>",
                    en: "Welcome to HRNtrack v2.0! A complete design overhaul has been deployed for a cleaner, more modern, and elegant experience.<br><br><strong>New Series Added (28 items):</strong><ul><li><strong>After Dark Charm Series</strong></li><li><strong>After Dark Magnet Series</strong></li><li><strong>After Dark Pendant Series</strong></li><li><strong>Accessories & Special Editions</strong> (After Dark Mugs, Ambient Light, Diffuseur, The Hundreds Figure & Pendant, Dino Plush)</li></ul>"
                }
            },
            {
                version: "v1.2.1",
                date: "Août 2026",
                title: {
                    fr: "Mise à jour v1.2.1 : Ajout des Accessoires",
                    en: "Update v1.2.1: Accessories Added"
                },
                content: {
                    fr: "Excellente nouvelle ! Toutes les collections d'<strong>Accessoires</strong> ont été ajoutées au site. Vous pouvez désormais les tracker avec la même facilité que vos figurines pour compléter votre profil.",
                    en: "Great news! All <strong>Accessories</strong> collections have been added to the site. You can now track them just as easily as your figures to complete your profile."
                }
            },
            {
                version: "v1.2.0",
                date: "Mai 2026",
                title: {
                    fr: "Mise à jour v1.2.0 : Domaine, Connexion & Nouveautés",
                    en: "Update v1.2.0: Domain, Login & New Arrivals"
                },
                content: {
                    fr: "Grâce aux dons de la communauté, le site est désormais accessible via son propre domaine officiel : <strong>hrntrack.app</strong>. Un immense merci aux donateurs !<br><br><strong>Nouveautés de cette version :</strong><ul><li>Ajout de la figurine <strong>Behind Time Figure (Limited Edition)</strong>.</li><li>Ajout de la peluche <strong>Hirono × Kodak (Special Plush Doll)</strong>.</li><li>Amélioration du système de connexion : possibilité de <strong>se connecter avec Google</strong> et ajout d'une option <strong>\"Mot de passe oublié ?\"</strong>.</li></ul>",
                    en: "Thanks to community donations, the site is now accessible via its own official domain: <strong>hrntrack.app</strong>. A huge thank you to the donors!<br><br><strong>New in this version:</strong><ul><li>Added the <strong>Behind Time Figure (Limited Edition)</strong> figure.</li><li>Added the <strong>Hirono × Kodak (Special Plush Doll)</strong> plush.</li><li>Improved login system: ability to <strong>log in with Google</strong> and added a <strong>\"Forgot password?\"</strong> option.</li></ul>"
                }
            },
            {
                version: "v1.1.6",
                date: "Avril 2026",
                title: {
                    fr: "Série Tamed Wildgrass & Nouveautés",
                    en: "Tamed Wildgrass Series & New Arrivals"
                },
                content: {
                    fr: "Une mise à jour massive du catalogue !<br><ul><li>Ajout de la série complète <strong>Tamed Wildgrass</strong> (13 figurines, dont la secrète <em>Boundary</em>).</li><li>Ajout des peluches <strong>Little Hare Pink & Black</strong> (Special Plush Dolls).</li><li>Ajout de la figurine <strong>Tuk-Tuk</strong> (Special Edition).</li></ul>",
                    en: "A massive catalog update!<br><ul><li>Added the complete <strong>Tamed Wildgrass</strong> series (13 figures, including the secret <em>Boundary</em>).</li><li>Added the <strong>Little Hare Pink & Black</strong> plush dolls (Specials).</li><li>Added the <strong>Tuk-Tuk</strong> figure.</li></ul>"
                }
            },
            {
                version: "v1.1.5",
                date: "06 Mar 2026",
                title: {
                    fr: "Optimisation de la page Collection",
                    en: "Collection Page Optimization"
                },
                content: {
                    fr: "<ul><li>Refonte complète du système de graphiques : affichage des vraies données historiques de la communauté.</li><li>Meilleure gestion des affichages lorsqu'il y a peu ou pas d'historique (ex: 1 seule donnée).</li><li>Améliorations esthétiques et responsive (PC/Mobile) de la pop-up.</li></ul>",
                    en: "<ul><li>Complete overhaul of the chart system: displaying real community historical data.</li><li>Better fallback display when there is little to no history (e.g., only 1 data point).</li><li>Aesthetic and responsive (PC/Mobile) improvements to the pop-up modal.</li></ul>"
                }
            },
            {
                version: "v1.1.4",
                date: "02 Mar 2026",
                title: {
                    fr: "Ajout du Dollar Canadien (CAD)",
                    en: "Canadian Dollar (CAD) Support"
                },
                content: {
                    fr: "Vous l'avez demandé ! Le <strong>Dollar Canadien (CAD / CA$)</strong> est désormais disponible dans le choix des devises pour vos achats. Les cotes et les statistiques prennent désormais correctement en compte cette monnaie.",
                    en: "You asked for it! The <strong>Canadian Dollar (CAD / CA$)</strong> is now available in the currency selection for your purchases. Market values and statistics now properly support this currency."
                }
            },
            {
                version: "v1.1.3",
                date: "22 Feb 2026",
                title: {
                    fr: "Nouveaux Ajouts (Specials)",
                    en: "New Additions (Specials)"
                },
                content: {
                    fr: "Ajout de 3 nouvelles figurines <strong>Special Edition / Blister</strong> au tracker :<ul><li>Freedom Island Plus</li><li>Well Pharmacy</li><li>Elephant in the room marbed</li></ul>",
                    en: "Added 3 new <strong>Special Edition / Blister</strong> figures to the tracker:<ul><li>Freedom Island Plus</li><li>Well Pharmacy</li><li>Elephant in the room marbed </li></ul>"
                }
            },
            {
                version: "v1.1.2",
                date: "24 Jan 2026",
                title: {
                    fr: "Mise à jour Base de Données & Ranks",
                    en: "Database & Rank Update"
                },
                content: {
                    fr: "<ul><li>Ajout de la figurine <strong>Luck on the Way (Special Edition)</strong>.</li><li>Mise à jour majeure du système de <strong>Rank</strong> (plus de paliers : Amateur, Legend...).</li><li>Amélioration du système de badges.</li></ul>",
                    en: "<ul><li>Added figure <strong>Luck on the Way (Special Edition)</strong>.</li><li>Major update to the <strong>Rank</strong> system (new tiers: Amateur, Legend...).</li><li>Badge system improvement.</li></ul>"
                }
            },
            {
                version: "v1.1.1",
                date: "19 Jan 2026",
                title: {
                    fr: "Fonctionnalités Majeures",
                    en: "Major Features"
                },
                content: {
                    fr: "<p><strong>Suivi des Cotes & Graphiques :</strong> Fini les fichiers Excel ! Consultez la Cote Communautaire estimée pour chaque figurine et visualisez l'Historique des Prix (tendance sur 6 mois) directement sur la fiche.</p><p><strong>Personnalisez votre Profil :</strong> C'est votre espace ! Ajoutez désormais un Pseudo et une Photo de Profil pour rendre votre page de collection unique.</p><p><strong>Partage de Collection :</strong> Générez un lien public unique en un clic. Partagez votre vitrine personnalisée à vos amis (même s'ils n'ont pas de compte) !</p><p><strong>Système de Trophées :</strong> Votre passion est récompensée ! Débloquez des badges exclusifs comme Chasseur, Investisseur, Complétiste et bien d'autres.</p>",
                    en: "<p><strong>Market Trends & Charts:</strong> No more Excel files! Check the estimated Community Value for each figure and view Price History (6-month trend) directly on the card.</p><p><strong>Customize your Profile:</strong> It's your space! Add a Nickname and Profile Picture to make your collection page unique.</p><p><strong>Collection Sharing:</strong> Generate a unique public link in one click. Share your personalized showcase with friends (even if they don't have an account)!</p><p><strong>Trophy System:</strong> Your passion is rewarded! Unlock exclusive badges like Hunter, Investor, Completionist, and many more.</p>"
                }
            },
            {
                version: "v1.1.0",
                date: "13 Jan 2026",
                title: {
                    fr: "Les Cotes Communautaires sont actives !",
                    en: "Community Prices are Live!"
                },
                content: {
                    fr: "<p>Nous avons déployé un nouvel algorithme qui calcule la valeur marché (Cote) de chaque figurine en se basant sur les prix d'achat réels de toute la communauté.</p><p><strong>POURQUOI C'EST IMPORTANT ?</strong><br>Pour que ce système fonctionne et que votre \"Deal Score\" (Indicateur de bonne affaire) soit juste, nous avons besoin de données précises.</p><div class=\"alert-box\"><span class=\"alert-title\">⚠️ LA DEVISE (CURRENCY) EST CRUCIALE !</span>Si vous avez acheté une figurine en Dollars ($) ou en Livres (£), merci de bien sélectionner la devise correspondante.<br><em>Exemple : Si vous notez \"20\" en prix d'achat pour du $USD mais que vous laissez la devise sur \"€\" (EUR), cela fausse les statistiques de tout le monde !</em><br><br><strong>Action requise :</strong><ul style=\"margin-bottom:0;\"><li>Allez dans votre Collection.</li><li>Vérifiez vos prix d'achat.</li><li>Assurez-vous que le champ Devise correspond bien à ce que vous avez payé.</li></ul></div>",
                    en: "<p>We deployed a new algorithm calculating the market value of each figure based on real purchase prices from the community.</p><p><strong>WHY IS THIS IMPORTANT?</strong><br>For this system to work and your \"Deal Score\" to be accurate, we need precise data.</p><div class=\"alert-box\"><span class=\"alert-title\">⚠️ CURRENCY IS CRUCIAL!</span>If you bought a figure in Dollars ($) or Pounds (£), please select the corresponding currency.<br><em>Example: If you input \"20\" as purchase price for $USD but leave the currency on \"€\" (EUR), it skews stats for everyone!</em><br><br><strong>Action required:</strong><ul style=\"margin-bottom:0;\"><li>Go to your Collection.</li><li>Check your purchase prices.</li><li>Ensure the Currency field matches what you paid.</li></ul></div>"
                }
            },
            {
                version: "v1.0.1",
                date: "12 Jan 2026",
                title: {
                    fr: "New Arrivals",
                    en: "New Arrivals"
                },
                content: {
                    fr: "3 nouvelles \"Special Blind Box\" sont disponibles sur le tracker ! C'est l'heure de mettre à jour votre collection ou votre wishlist.<ul><li>Wish List Pendant</li><li>Good Health</li><li>Luck on the Way</li></ul>",
                    en: "3 new \"Special Blind Boxes\" are available on the tracker! Time to update your collection or wishlist.<ul><li>Wish List Pendant</li><li>Good Health</li><li>Luck on the Way</li></ul>"

            }
        ];

        const translations = withCommon({
            fr: {                pageTitle: "Notes de Mise à Jour", pageSub: "L'historique des nouveautés et améliorations."                },            en: {                pageTitle: "Release Notes", pageSub: "History of updates and improvements.",                title_v210: "Harry Potter Series & Special Editions", content_v210: "<strong>New figures (18):</strong><ul><li><strong>Harry Potter Series</strong> (14 figures including 2 secrets: Mandrake and Harry Potter Special Edition)</li><li><strong>Special Editions</strong>: UV WWR Square Garden Patrol, UV WWR Lucky Bertie, Snowman Figurine, Kodak Click Figure</li></ul><strong>Website improvements:</strong><ul><li>Faster pages (home photo 40× lighter)</li><li>Pinch-zoom allowed on mobile and full keyboard navigation</li><li>Fix: your nickname and avatar are no longer erased when saving your collection</li><li>Fix: your purchase currency is kept when adding a figure from New Releases</li><li>More reliable values (median price, typos filtered out)</li></ul>", title_v200: "v2.0 Overhaul & New After Dark Series",                content_v200: "Welcome to HRNtrack v2.0! A complete design overhaul has been deployed for a cleaner, more modern, and elegant experience.<br><br><strong>New Series Added (28 items):</strong><ul><li><strong>After Dark Charm Series</strong></li><li><strong>After Dark Magnet Series</strong></li><li><strong>After Dark Pendant Series</strong></li><li><strong>Accessories & Special Editions</strong> (After Dark Mugs, Ambient Light, Diffuseur, The Hundreds Figure & Pendant, Dino Plush)</li></ul>",                title_v121: "Update v1.2.1: Accessories Added",                content_v121: "Great news! All <strong>Accessories</strong> collections have been added to the site. You can now track them just as easily as your figures to complete your profile.",                title_v120: "Update v1.2.0: Domain, Login & New Arrivals",                content_v120: "Thanks to community donations, the site is now accessible via its own official domain: <strong>hrntrack.app</strong>. A huge thank you to the donors!<br><br><strong>New in this version:</strong><ul><li>Added the <strong>Behind Time Figure (Limited Edition)</strong> figure.</li><li>Added the <strong>Hirono × Kodak (Special Plush Doll)</strong> plush.</li><li>Improved login system: ability to <strong>log in with Google</strong> and added a <strong>\"Forgot password?\"</strong> option.</li></ul>",                title_16apr: "Tamed Wildgrass Series & New Arrivals",                content_16apr: `A massive catalog update!<br><ul><li>Added the complete <strong>Tamed Wildgrass</strong> series (13 figures, including the secret <em>Boundary</em>).</li><li>Added the <strong>Little Hare Pink & Black</strong> plush dolls (Specials).</li><li>Added the <strong>Tuk-Tuk</strong> figure.</li></ul>`,                title_06mar: "Collection Page Optimization",                content_06mar: `<ul><li>Complete overhaul of the chart system: displaying real community historical data.</li><li>Better fallback display when there is little to no history (e.g., only 1 data point).</li><li>Aesthetic and responsive (PC/Mobile) improvements to the pop-up modal.</li></ul>`,                title_02mar: "Canadian Dollar (CAD) Support",                content_02mar: `You asked for it! The <strong>Canadian Dollar (CAD / CA$)</strong> is now available in the currency selection for your purchases. Market values and statistics now properly support this currency.`,                title_22feb: "New Additions (Specials)",                content_22feb: `Added 3 new <strong>Special Edition / Blister</strong> figures to the tracker:<ul><li>Freedom Island Plus</li><li>Well Pharmacy</li><li>Elephant in the room marbed </li></ul>`,                title_24jan: "Database & Rank Update",                content_24jan: `<ul><li>Added figure <strong>Luck on the Way (Special Edition)</strong>.</li><li>Major update to the <strong>Rank</strong> system (new tiers: Amateur, Legend...).</li><li>Badge system improvement.</li></ul>`,                title_19jan: "Major Features",                content_19jan: `<p><strong>Market Trends & Charts:</strong> No more Excel files! Check the estimated Community Value for each figure and view Price History (6-month trend) directly on the card.</p><p><strong>Customize your Profile:</strong> It's your space! Add a Nickname and Profile Picture to make your collection page unique.</p><p><strong>Collection Sharing:</strong> Generate a unique public link in one click. Share your personalized showcase with friends (even if they don't have an account)!</p><p><strong>Trophy System:</strong> Your passion is rewarded! Unlock exclusive badges like Hunter, Investor, Completionist, and many more.</p>`,                title_13jan: "Community Prices are Live!",                content_13jan: `<p>We deployed a new algorithm calculating the market value of each figure based on real purchase prices from the community.</p><p><strong>WHY IS THIS IMPORTANT?</strong><br>For this system to work and your "Deal Score" to be accurate, we need precise data.</p><div class="alert-box"><span class="alert-title">⚠️ CURRENCY IS CRUCIAL!</span>If you bought a figure in Dollars ($) or Pounds (£), please select the corresponding currency.<br><em>Example: If you input "20" as purchase price for $USD but leave the currency on "€" (EUR), it skews stats for everyone!</em><br><br><strong>Action required:</strong><ul style="margin-bottom:0;"><li>Go to your Collection.</li><li>Check your purchase prices.</li><li>Ensure the Currency field matches what you paid.</li></ul></div>`,                title_12jan: "New Arrivals",                content_12jan: `3 new "Special Blind Boxes" are available on the tracker! Time to update your collection or wishlist.<ul><li>Wish List Pendant</li><li>Good Health</li><li>Luck on the Way</li></ul>`                }        });

        let currentLang = localStorage.getItem('HRN_LANG') || 'fr';
        
        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const pick = (v) => (v && typeof v === 'object') ? (v[currentLang] || v.fr) : v;

        function renderReleases() {
            const root = document.getElementById('timeline');
            if (!root) return;
            root.innerHTML = RELEASES.map(r => `
            <div class="release-card">
                <div class="release-meta">
                    <span class="release-date">${esc(pick(r.date))}</span>
                    <span class="version-badge">${esc(r.version)}</span>
                </div>
                <div class="release-title">${esc(pick(r.title))}</div>
                <div class="release-content">${pick(r.content)}</div>
            </div>`).join('');
        }

        function updateUIText() {
            syncLangToggle(currentLang);
            renderReleases();
            
            const tr = translations[currentLang];
            document.querySelectorAll('[data-t]').forEach(el => { 
                const key = el.getAttribute('data-t'); 
                if(tr[key]) el.innerHTML = tr[key]; 
            });
            
            updateAuthLabel(tr);
        }

        window.toggleLanguage = () => {
            currentLang = (currentLang === 'fr') ? 'en' : 'fr';
            localStorage.setItem('HRN_LANG', currentLang);
            updateUIText();
        };

        setupAuthModal(() => currentLang);

        window.onclick = function(event) { if (event.target.classList.contains('modal-overlay')) { event.target.style.display = "none"; } }

        onAuthStateChanged(auth, (user) => {
            updateUIText();
            updateAuthButtons(!!user);
            document.body.classList.add('ready');
        });

        fetch('footer.html')
            .then(r=>r.text())
            .then(d=>{
                document.getElementById('footer-placeholder').innerHTML=d;
                if(window.updateUIText) window.updateUIText();
                if(window.initCookieLogic) window.initCookieLogic();
            })
            .catch(error => console.error('Erreur Footer:', error));
    </script>
</body>
</html>
