    <style>

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: var(--font-sans); 
            margin: 0; 
            padding: 0;
            -webkit-font-smoothing: antialiased; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            padding-bottom: var(--nav-height-mobile);
            opacity: 0; 
            transition: opacity 0.3s ease-in-out;
        }
        body.auth-ready { opacity: 1; }

        /* --- NAVIGATION SUPÉRIEURE --- */

        .nav-link:hover, .nav-link.active {
            border-bottom-color: var(--color-dark);
            font-weight: 600;
        }

        .btn-auth-trigger.logged-in {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-auth-trigger.logged-in:hover {
            background: var(--primary);
            color: #ffffff;
        }

        /* Mobile Hamburger Button */

        .mobile-drawer .nav-link {
            font-size: 1rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--color-border);
            width: 100%;
        }

        @media (min-width: 993px) { body { padding-bottom: 0; } }

        /* --- CONTENT STYLE --- */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; width: 100%; box-sizing: border-box; flex: 1; }

        .hero-title {
            font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin: 0 0 6px; line-height: inherit;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .hero-subtitle { color: var(--text-sub); margin-bottom: 16px; font-size: 0.88rem; }
        /* Alertes nouveautés */
        .push-box { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
        .push-btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; cursor: pointer;
            border: 1px solid var(--color-dark); background: var(--color-dark); color: var(--color-light);
            font: 600 0.76rem var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase;
        }
        .push-btn:hover { background: transparent; color: var(--color-dark); }
        .push-btn[aria-pressed="true"] { background: var(--surface); color: var(--text-main); border-color: var(--color-green); }
        .push-btn[aria-disabled="true"] { opacity: 0.6; cursor: progress; }
        .push-btn[hidden] { display: none; }
        .push-hint { font-size: 0.78rem; color: var(--text-sub); max-width: 520px; }
        /* Calendrier des sorties à venir */
        .upcoming { margin: 0 0 34px; }
        .upcoming-title { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 12px; }
        .upcoming-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        .upcoming-item { display: flex; gap: 12px; align-items: stretch; background: var(--surface); border: 1px solid var(--color-border); border-left: 4px solid var(--color-gold); padding: 12px; min-width: 0; }
        .upcoming-date { flex: 0 0 auto; min-width: 54px; text-align: center; background: var(--color-sand); padding: 6px 4px; display: flex; flex-direction: column; justify-content: center; }
        .upcoming-date b { display: block; font-size: 1.2rem; font-weight: 800; line-height: 1; }
        .upcoming-date span { display: block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-sub); margin-top: 3px; }
        .upcoming-body { min-width: 0; flex: 1; }
        .upcoming-body strong { display: block; font-size: 0.9rem; }
        .upcoming-body small { display: block; font-size: 0.74rem; color: var(--text-sub); margin-top: 2px; }
        .upcoming-tag { display: inline-block; margin-top: 6px; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; background: var(--color-gold-light); border: 1px solid var(--color-gold); }
        .upcoming-body a { font-size: 0.72rem; color: var(--text-main); }
        .upcoming-img { width: 56px; height: 56px; object-fit: contain; background: var(--color-sand); flex-shrink: 0; }
        .upcoming-empty { color: var(--text-sub); font-size: 0.82rem; padding: 14px; border: 1px dashed var(--color-border); background: var(--surface); }

        .release-section { margin-bottom: 45px; }
        .section-header { 
            display: flex; align-items: center; justify-content: space-between; 
            margin-bottom: 20px; border-bottom: 1px solid var(--color-border); padding-bottom: 10px;
        }
        .section-name { font-size: 0.95rem; font-weight: 700; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.08em; }
        .section-tag { 
            background: var(--color-dark); color: var(--color-light); padding: 3px 10px; 
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
        }
        .tag-new { background: var(--primary); }

        /* GRID */
        .release-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 20px;
        }

        /* CARD */
        .card {
            background: var(--surface); border: 1px solid var(--color-border); padding: 12px; position: relative;
            box-shadow: var(--shadow); transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer;
        }
        .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--color-dark); }
        
        .card-badge {
            position: absolute; top: 10px; left: 10px; z-index: 2;
            background: var(--color-red); color: white; font-size: 0.65rem; font-weight: 700;
            padding: 2px 6px; letter-spacing: 0.08em; text-transform: uppercase;
        }

        /* Carte : bouton invisible qui la couvre (ouvre la fenêtre, ou la page publique si déconnecté) + lien ↗ à part */
        .card-open { position: absolute; inset: 0; z-index: 1; }
        .card-open:focus-visible { outline: 2px solid var(--color-dark); outline-offset: 2px; }
        .card-quick { position: relative; z-index: 3; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; margin-top: 10px; }
        .q-btn { padding: 8px 4px; border: 1px solid var(--color-border); background: var(--color-sand); color: var(--text-sub); cursor: pointer;
            font: 600 0.7rem var(--font-sans); letter-spacing: 0.04em; text-transform: uppercase; transition: all 0.15s ease; }
        .q-btn:hover { border-color: var(--color-dark); color: var(--text-main); }
        .q-btn:focus-visible { outline: 2px solid var(--color-dark); outline-offset: 2px; }
        .q-own[aria-pressed="true"] { background: var(--color-green); border-color: var(--color-green); color: #fff; }
        .q-wish[aria-pressed="true"] { background: #E67E22; border-color: #E67E22; color: #fff; }
        .card-img-wrapper {
            position: relative; width: 100%; aspect-ratio: 1/1; overflow: hidden; margin-bottom: 12px;
            background: var(--color-sand); display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--color-border);
        }
        .card-img { width: 100%; height: 100%; object-fit: cover; }

        .card-name { font-size: 0.8rem; font-weight: 600; color: var(--text-main); margin-bottom: 4px; line-height: 1.3; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; }
        .card-serie { font-size: 0.7rem; color: var(--text-sub); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }

        /* ACTION BUTTON ON CARD */
        .btn-card-action {
            width: 100%; padding: 8px; border: 1px solid var(--color-border); font-family: var(--font-sans); font-size: 0.75rem; font-weight: 600;
            letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; transition: all 0.25s ease;
            background: var(--color-sand); color: var(--text-sub);
        }
        .btn-card-action:hover { background: var(--color-dark); color: var(--color-light); border-color: var(--color-dark); }
        
        .card.owned .btn-card-action { background: var(--primary); color: white; border-color: var(--primary); }
        .card.owned { border-color: var(--primary); }
        .card.wished .btn-card-action { background: var(--color-gold); color: white; border-color: var(--color-gold); }
        .card.wished { border: 1px dashed var(--color-gold); }

        /* --- STYLES MODAL --- */
        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 26, 0.7);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: var(--card-bg);
            color: var(--text-main);
            padding: 2.2rem;
            border: 1px solid var(--color-border);
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-label {
            display: block; margin-bottom: 6px; color: var(--color-dark); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
        }

        #auth-modal input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--color-border);
            color: var(--text-main);
            padding: 10px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.25s ease;
        }
        #auth-modal input:focus {
            border-color: var(--color-dark);
        }

        .form-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;
        }

        .btn-save {
            width: 100%; padding: 12px; background: var(--color-dark); color: var(--color-light);
            border: 1px solid var(--color-dark); font-family: var(--font-sans); font-weight: 600; font-size: 0.82rem;
            letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; margin-top: 15px; transition: all 0.25s ease;
        }
        .btn-save:hover { background: transparent; color: var(--color-dark); }

        .btn-cancel {
            width: 100%; padding: 10px; background: transparent; color: var(--color-text-sub);
            border: none; cursor: pointer; margin-top: 5px; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: underline;
        }
        .btn-cancel:hover { color: var(--color-red); }
        
        /* AUTH STYLES */
        .auth-title { text-align: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: var(--color-dark); }
        .auth-separator { margin: 1.2rem 0; font-size: 0.75rem; letter-spacing: 0.15em; color: var(--color-text-sub); text-align: center; }

    </style>
</head>
<body>

<script src="assets/site.js"></script>

<script type="module">
        import { app } from './assets/firebase.js';
        import { db as sharedDb } from './assets/db.js';
        import { withCommon, syncLangToggle } from './assets/i18n.js';
        import { recordVisit } from './assets/activity.js';
        import { syncPublicProfile } from './assets/public-profile.js';
        import { baseData } from './data.js?v=2026-11-27-1';
        import { pushStatus, enablePush, disablePush } from './assets/push.js';
        import { UPCOMING } from './assets/upcoming.js';
        import { figureSlugs, figureHref } from './assets/figure-url.js';
        import { saveCollection, toggleStatus } from './assets/collection-save.js';
        // Page publique de chaque figurine (bouton ↗ des cartes)
        let ficheSlugs = null;
        const ficheOf = (id) => { ficheSlugs = ficheSlugs || figureSlugs(baseData); const sl = ficheSlugs.get(String(id)); return sl ? figureHref(sl) : ''; };
        const escAttr = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const fmtQuick = (key, name) => String(translations[currentLang][key] || translations.fr[key]).replace('{name}', name);
        import { auth, setupAuthModal, updateAuthButtons } from './assets/auth.js';
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const db = sharedDb;   // base avec cache local (assets/db.js)

        // ================================================================
        // NOUVEAUTÉS AFFICHÉES — seule partie à modifier à chaque mise à jour.
        // Chaque section liste des ID de data.js (nom, image, série et secret
        // sont lus automatiquement dans le catalogue).
        // ================================================================
        const NEW_SECTIONS = [
            {
                title: { fr: "Série Harry Potter", en: "Harry Potter Series" },
                tag: { fr: "NOUVEAU", en: "NEW" },
                ids: ["HPO-RUB", "HPO-SEV", "HPO-ALB", "HPO-TSH", "HPO-LUN", "HPO-SIR", "HPO-LORD",
                      "HPO-QUID", "HPO-RON", "HPO-HED", "HPO-DOB", "HPO-DRA", "HPO-MAND", "HPO-HPSE"]
            },
            {
                title: { fr: "Éditions Spéciales", en: "Special Editions" },
                tag: { fr: "NOUVEAU", en: "NEW" },
                ids: ["SPE-UVWS", "SPE-UVWL", "SPE-SNOFI", "SPE-KOCF"]
            }
        ];

        const catalogById = new Map(baseData.map(b => [b.ID, b]));
        const sections = NEW_SECTIONS.map(section => ({
            ...section,
            items: section.ids.map(id => {
                const b = catalogById.get(id);
                if (!b) { console.warn("Nouveautés : ID absent de data.js :", id); return null; }
                return { id: b.ID, name: b.Name, serie: b.Serie, img: b.Image, isSecret: b["Secret Rare"] === "Yes" };
            }).filter(Boolean)
        }));
        const newReleases = sections.flatMap(s => s.items);

        let userCollection = [];
        let currentUser = null;

        const translations = withCommon({
            fr: {                 navAccount: "Mon Compte",                navNew: "Nouveautés",                pageTitle: "Dernières Sorties",                pageSub: "Les nouveautés Hirono les plus récentes.",                btnAdd: "Ajouter",                 btnOwned: "Possédé",                 btnWish: "Recherché",                 btnSave: "Enregistrer",                btnClose: "Fermer",                lblStatus: "Statut",                optNone: "Non possédé",                optOwned: "Dans ma collection",                optWish: "Wishlist",                lblCondition: "Condition",                condUnknown: "Inconnu",                condMint: "Neuf (Mint)",                condGood: "Bon",                condFair: "Moyen",                condDamaged: "Abimé",                lblQty: "Quantité",                lblPrice: "Prix",                lblDate: "Date d'achat",                lblNotes: "Notes", ficheAria: "Page publique de {name}", quickOwn: "Je l'ai : {name}", quickWish: "Je la cherche : {name}", alertErr: "Erreur : "                },            en: {                 navAccount: "My Account",                navNew: "New Releases",                pageTitle: "Latest Releases",                pageSub: "The most recent Hirono releases.",                btnAdd: "Add",                 btnOwned: "Owned",                 btnWish: "Wishlist",                 btnSave: "Save",                btnClose: "Close",                lblStatus: "Status",                optNone: "Not owned",                optOwned: "In collection",                optWish: "Wishlist",                lblCondition: "Condition",                condUnknown: "Unknown",                condMint: "Mint",                condGood: "Good",                condFair: "Fair",                condDamaged: "Damaged",                lblQty: "Quantity",                lblPrice: "Price",                lblDate: "Purchase Date",                lblNotes: "Notes", ficheAria: "Public page of {name}", quickOwn: "I have it: {name}", quickWish: "I want it: {name}", alertErr: "Error: "                }        });
        
        let currentLang = localStorage.getItem('HRN_LANG') || 'fr';
        function t(key) { return translations[currentLang]?.[key] || key; }

        // --- CALENDRIER DES SORTIES À VENIR ---
        const UPCOMING_TEXT = {
            fr: { title: "🗓️ À venir", empty: "Aucune sortie annoncée pour le moment. Activez les alertes pour être prévenu dès l'arrivée des nouvelles figurines.", announce: "Voir l'annonce", day: "jour à confirmer",
                types: { serie: "Nouvelle série", special: "Édition spéciale", collab: "Collaboration", autre: "Sortie" } },
            en: { title: "🗓️ Coming soon", empty: "No release announced yet. Turn on alerts to hear as soon as new figures arrive.", announce: "See the announcement", day: "day to be confirmed",
                types: { serie: "New series", special: "Special edition", collab: "Collaboration", autre: "Release" } }
        };
        function renderUpcoming() {
            const T = UPCOMING_TEXT[currentLang] || { ...UPCOMING_TEXT.en, ...((window.HRN_PACK && window.HRN_PACK.modules && window.HRN_PACK.modules.upcoming) || {}) };
            const loc = (window.HRN_LOCALES[currentLang] || 'fr-FR');
            const e = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            const safeUrl = (u) => (/^https:\/\//i.test(String(u || '')) ? String(u) : '');
            const thisMonth = new Date().toISOString().slice(0, 7);
            const list = UPCOMING.filter(u => u && u.name && /^\d{4}-\d{2}(-\d{2})?$/.test(u.date || '') && u.date.slice(0, 7) >= thisMonth)
                .sort((a, b) => a.date.localeCompare(b.date));
            document.getElementById('upcoming-title').textContent = T.title;
            document.getElementById('upcoming-list').innerHTML = list.length ? list.map(u => {
                const d = new Date((u.date.length === 7 ? u.date + '-01' : u.date) + 'T12:00:00');
                const big = u.date.length === 10 ? d.getDate() : d.toLocaleDateString(loc, { month: 'short' }).replace('.', '');
                const small = u.date.length === 10 ? d.toLocaleDateString(loc, { month: 'short', year: 'numeric' }) : d.getFullYear();
                const img = safeUrl(u.image), link = safeUrl(u.link);
                const note = currentLang !== 'fr' && u.noteEn ? u.noteEn : u.note;
                return `<li class="upcoming-item">
                    <div class="upcoming-date"><b>${e(big)}</b><span>${e(small)}</span></div>
                    <div class="upcoming-body"><strong>${e(u.name)}</strong>${note ? `<small>${e(note)}</small>` : ''}${u.date.length === 7 ? `<small>${e(T.day)}</small>` : ''}
                        <span class="upcoming-tag">${e(T.types[u.type] || T.types.serie)}</span>${link ? ` <a href="${e(link)}" target="_blank" rel="noopener noreferrer">${e(T.announce)} ↗</a>` : ''}</div>
                    ${img ? `<img class="upcoming-img" src="${e(img)}" alt="" loading="lazy" decoding="async">` : ''}
                </li>`;
            }).join('') : `<li class="upcoming-empty">${e(T.empty)}</li>`;
        }
        renderUpcoming();

        // --- ALERTES NOUVEAUTÉS (notification sur l'appareil, assets/push.js) ---
        const PUSH_TEXT = {
            fr: { on: "Alertes activées", off: "Me prévenir des nouveautés", busy: "Activation…",
                hintOn: "Vous recevrez une notification à chaque arrivée de nouvelles figurines. Recliquez pour les désactiver.",
                hintOff: "Recevez une notification sur cet appareil quand de nouvelles figurines arrivent dans le catalogue.",
                denied: "Les notifications sont bloquées pour HRNtrack dans votre navigateur : autorisez-les dans les réglages du site.",
                ios: "Sur iPhone / iPad, installez d'abord HRNtrack sur l'écran d'accueil (Partager → Sur l'écran d'accueil), puis activez les alertes depuis l'appli.",
                unsupported: "Votre navigateur ne permet pas encore les notifications.",
                enabled: "Alertes activées : vous serez prévenu des prochaines sorties.", disabled: "Alertes désactivées sur cet appareil.",
                error: "Impossible d'activer les alertes pour le moment. Réessayez plus tard." },
            en: { on: "Alerts on", off: "Notify me of new releases", busy: "Turning on…",
                hintOn: "You'll get a notification whenever new figures arrive. Click again to turn them off.",
                hintOff: "Get a notification on this device when new figures arrive in the catalog.",
                denied: "Notifications are blocked for HRNtrack in your browser: allow them in the site settings.",
                ios: "On iPhone / iPad, first add HRNtrack to your home screen (Share → Add to Home Screen), then turn on alerts from the app.",
                unsupported: "Your browser doesn't support notifications yet.",
                enabled: "Alerts on: you'll hear about the next releases.", disabled: "Alerts turned off on this device.",
                error: "Couldn't turn on alerts right now. Please try again later." }
        };
        const pt = (k) => (PUSH_TEXT[currentLang] || { ...PUSH_TEXT.en, ...((window.HRN_PACK && window.HRN_PACK.modules && window.HRN_PACK.modules.push) || {}) })[k];
        let pushState = 'unconfigured';
        async function refreshPush() {
            pushState = await pushStatus();
            const btn = document.getElementById('push-btn'), hint = document.getElementById('push-hint');
            // Clé Web Push pas encore renseignée : rien n'est affiché
            btn.hidden = pushState === 'unconfigured' || pushState === 'unsupported';
            btn.setAttribute('aria-pressed', String(pushState === 'on'));
            document.getElementById('push-label').textContent = pushState === 'on' ? pt('on') : pt('off');
            hint.textContent = { on: pt('hintOn'), off: pt('hintOff'), denied: pt('denied'), 'ios-install': pt('ios'), unsupported: '', unconfigured: '' }[pushState] || '';
            if (pushState === 'ios-install' || pushState === 'denied') btn.hidden = true;
        }
        document.getElementById('push-btn').addEventListener('click', async (e) => {
            const btn = e.currentTarget;
            if (btn.getAttribute('aria-disabled') === 'true') return;
            btn.setAttribute('aria-disabled', 'true');   // pas « disabled » : le focus reste sur le bouton
            try {
                if (pushState === 'on') { await disablePush(); hrnNotify(pt('disabled'), 'info'); }
                else {
                    document.getElementById('push-label').textContent = pt('busy');
                    const r = await enablePush();   // demande d'autorisation : uniquement après ce clic
                    if (r === 'on') hrnNotify(pt('enabled'), 'success');
                }
            } catch (err) {
                console.error('Alertes :', err);
                hrnNotify(pt('error'), 'error');
            } finally {
                btn.removeAttribute('aria-disabled');
                refreshPush();
            }
        });
        refreshPush();

        window.toggleLanguage = () => { setTimeout(() => { refreshPush && refreshPush(); renderUpcoming && renderUpcoming(); }, 0);
            currentLang = (currentLang === 'fr') ? 'en' : 'fr';
            localStorage.setItem('HRN_LANG', currentLang);
            updateUI();
        };

        window.updateUI = function() {
            syncLangToggle(currentLang);
            
            document.querySelectorAll('[data-t]').forEach(el => {
                const key = el.getAttribute('data-t');
                if(translations[currentLang][key]) el.innerText = translations[currentLang][key];
            });

            const btnText = document.getElementById('auth-status-text');
            const btnTextMob = document.getElementById('auth-status-text-mob');
            if(btnText) btnText.innerText = currentUser ? t('navAccount') : t('authLogin');
            if(btnTextMob) btnTextMob.innerText = currentUser ? t('navAccount') : t('authLogin');

            renderGrids();
        }

        setupAuthModal(() => currentLang);

        onAuthStateChanged(auth, async (user) => {
            if (user) recordVisit(db, user);
            currentUser = user;
            
            if (user) {
                updateAuthButtons(true);
                
                const docRef = doc(db, "users", user.uid);
                try {
                    const snap = await getDoc(docRef);
                    if(snap.exists()) {
                        userCollection = snap.data().collection || [];
                    } else {
                        userCollection = []; 
                    }
                } catch(e) { console.error("Erreur chargement:", e); }
            } else {
                updateAuthButtons(false);
                userCollection = [];
            }
            
            window.updateUI();
            document.body.classList.add('auth-ready');
        });

        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        function renderGrids() {
            const root = document.getElementById('release-sections');
            if (!root) return;
            root.innerHTML = sections.map((s, i) => `
                <div class="release-section">
                    <div class="section-header">
                        <span class="section-name">${esc(s.title[currentLang] || s.title.en || s.title.fr)}</span>
                        <span class="section-tag tag-new">${esc(s.tag[currentLang] || s.tag.en || s.tag.fr)}</span>
                    </div>
                    <div class="release-grid" id="release-grid-${i}"></div>
                </div>`).join('');
            sections.forEach((s, i) => {
                if (s.items.length) return renderSection('release-grid-' + i, s.items);
                // Aucune figurine trouvée : catalogue en cache pas encore à jour
                const grid = document.getElementById('release-grid-' + i);
                if (grid) grid.innerHTML = `<p style="grid-column:1/-1; color:var(--color-text-sub); font-size:0.85rem;">${currentLang !== 'fr'
                    ? 'New figures are loading. Please refresh the page (Ctrl+F5).'
                    : 'Les nouvelles figurines arrivent. Actualisez la page (Ctrl+F5).'}</p>`;
            });
        }

        function renderSection(elementId, items) {
            const container = document.getElementById(elementId);
            if(!container) return; 

            container.innerHTML = items.map(item => {
                const userItem = userCollection.find(u => u.ID === item.id);
                const isOwned = userItem && userItem.Status === 'Possédé';
                const isWished = userItem && userItem.Status === 'Recherché';
                
                let btnClass = "btn-card-action";
                let btnText = "+ " + t('btnAdd');
                let cardClass = "card";

                if (isOwned) { btnClass += " owned"; cardClass += " owned"; btnText = t('btnOwned'); }
                else if (isWished) { btnClass += " wished"; cardClass += " wished"; btnText = t('btnWish'); }

                const secretStyle = item.isSecret ? 'color:var(--color-gold); font-weight:700;' : '';
                const badge = 'NEW';

                // Connecté : boutons rapides ✓ (je l'ai) / ♥ (je la cherche) ; le détail se remplit sur la page de la figurine
                let actionBtnHtml = '';
                if (currentUser) {
                    actionBtnHtml = `<div class="card-quick">
                        <button type="button" class="q-btn q-own" data-act="own" data-id="${escAttr(item.id)}" aria-pressed="${!!isOwned}" aria-label="${escAttr(fmtQuick('quickOwn', item.name))}">✓ ${esc(t('btnOwned'))}</button>
                        <button type="button" class="q-btn q-wish" data-act="wish" data-id="${escAttr(item.id)}" aria-pressed="${!!isWished}" aria-label="${escAttr(fmtQuick('quickWish', item.name))}">♥ ${esc(t('btnWish'))}</button>
                    </div>`;
                }
                const fiche = ficheOf(item.id) || '#';

                return `
                <div class="${cardClass}" data-id="${escAttr(item.id)}">
                    <a class="card-open" href="${escAttr(fiche)}" aria-label="${escAttr(item.name)}"></a>
                    <span class="card-badge">${badge}</span>
                    <div class="card-img-wrapper">
                        <img src="${item.img}" class="card-img" alt="" loading="lazy">
                    </div>
                    <div class="card-name" style="${secretStyle}">${item.name}</div>
                    <div class="card-serie">${item.serie}</div>
                    ${actionBtnHtml}
                </div>`;
            }).join('');
        }

        // Boutons rapides : même enregistrement que la Collection (assets/collection-save.js), fiche publique comprise
        let saveTimer = null;
        function flushSave() {
            if (!saveTimer) return;
            clearTimeout(saveTimer); saveTimer = null;
            if (!currentUser) return;
            saveCollection(db, currentUser.uid, userCollection)
                .catch(e => { console.error("Erreur Firebase:", e); hrnNotify(t('alertErr') + e.message); });
        }
        window.addEventListener('pagehide', flushSave);
        document.getElementById('release-sections').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-act]');
            if (!btn || !currentUser) return;
            e.preventDefault();
            userCollection = toggleStatus(userCollection, btn.dataset.id, btn.dataset.act).list;
            const act = btn.dataset.act, id = btn.dataset.id;
            renderGrids();
            document.querySelector('.card[data-id="' + CSS.escape(id) + '"] [data-act="' + act + '"]')?.focus();
            clearTimeout(saveTimer); saveTimer = setTimeout(() => { saveTimer = 1; flushSave(); }, 600);
        });

        window.onclick = function(event) {
            const authModal = document.getElementById('auth-modal');
            if (event.target == authModal) window.toggleAuthModal();
        }

        fetch('footer.html')
            .then(response => {
                if (!response.ok) throw new Error("Erreur chargement footer");
                return response.text();
            })
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
                if(window.updateUI) window.updateUI();
                if(window.initCookieLogic) window.initCookieLogic();
            })
            .catch(error => console.error('Erreur Footer:', error));
    </script>
</body>
</html>
