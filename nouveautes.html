<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://api.frankfurter.dev https://formsubmit.co; frame-src https://hrntrack-1cfe3.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <script src="assets/theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRNtrack - Nouveautés</title>
    <link rel="icon" type="image/vnd.icon" href="https://i.postimg.cc/pLqpbbHb/IMG-0226f.png">
    
    <!-- Typographie Poppins -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/common.css">
    
    <style>

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: var(--font-sans); 
            margin: 0; 
            padding: 0;
            -webkit-font-smoothing: antialiased; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            padding-bottom: var(--nav-height-mobile);
            opacity: 0; 
            transition: opacity 0.3s ease-in-out;
        }
        body.auth-ready { opacity: 1; }

        /* --- NAVIGATION SUPÉRIEURE --- */

        .nav-link:hover, .nav-link.active {
            border-bottom-color: var(--color-dark);
            font-weight: 600;
        }

        .btn-auth-trigger.logged-in {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-auth-trigger.logged-in:hover {
            background: var(--primary);
            color: #ffffff;
        }

        /* Mobile Hamburger Button */

        .mobile-drawer .nav-link {
            font-size: 1rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--color-border);
            width: 100%;
        }

        @media (min-width: 993px) { body { padding-bottom: 0; } }

        /* --- CONTENT STYLE --- */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; width: 100%; box-sizing: border-box; flex: 1; }

        .hero-title {
            font-size: 1.6rem; font-weight: 800; color: var(--text-main); margin-bottom: 6px;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .hero-subtitle { color: var(--text-sub); margin-bottom: 35px; font-size: 0.88rem; }

        .release-section { margin-bottom: 45px; }
        .section-header { 
            display: flex; align-items: center; justify-content: space-between; 
            margin-bottom: 20px; border-bottom: 1px solid var(--color-border); padding-bottom: 10px;
        }
        .section-name { font-size: 0.95rem; font-weight: 700; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.08em; }
        .section-tag { 
            background: var(--color-dark); color: var(--color-light); padding: 3px 10px; 
            font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
        }
        .tag-new { background: var(--primary); }

        /* GRID */
        .release-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 20px;
        }

        /* CARD */
        .card {
            background: var(--surface); border: 1px solid var(--color-border); padding: 12px; position: relative;
            box-shadow: var(--shadow); transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer;
        }
        .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--color-dark); }
        
        .card-badge {
            position: absolute; top: 10px; left: 10px; z-index: 2;
            background: var(--color-red); color: white; font-size: 0.65rem; font-weight: 700;
            padding: 2px 6px; letter-spacing: 0.08em; text-transform: uppercase;
        }

        .card-img-wrapper {
            width: 100%; aspect-ratio: 1/1; overflow: hidden; margin-bottom: 12px;
            background: var(--color-sand); display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--color-border);
        }
        .card-img { width: 100%; height: 100%; object-fit: cover; }

        .card-name { font-size: 0.8rem; font-weight: 600; color: var(--text-main); margin-bottom: 4px; line-height: 1.3; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; }
        .card-serie { font-size: 0.7rem; color: var(--text-sub); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }

        /* ACTION BUTTON ON CARD */
        .btn-card-action {
            width: 100%; padding: 8px; border: 1px solid var(--color-border); font-family: var(--font-sans); font-size: 0.75rem; font-weight: 600;
            letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer; transition: all 0.25s ease;
            background: var(--color-sand); color: var(--text-sub);
        }
        .btn-card-action:hover { background: var(--color-dark); color: var(--color-light); border-color: var(--color-dark); }
        
        .card.owned .btn-card-action { background: var(--primary); color: white; border-color: var(--primary); }
        .card.owned { border-color: var(--primary); }
        .card.wished .btn-card-action { background: var(--color-gold); color: white; border-color: var(--color-gold); }
        .card.wished { border: 1px dashed var(--color-gold); }

        /* --- STYLES MODAL --- */
        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 26, 0.7);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: var(--card-bg);
            color: var(--text-main);
            padding: 2.2rem;
            border: 1px solid var(--color-border);
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-label {
            display: block; margin-bottom: 6px; color: var(--color-dark); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
        }

        #modal select, #modal input, #modal textarea, #auth-modal input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--color-border);
            color: var(--text-main);
            padding: 10px;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.25s ease;
        }
        #modal select:focus, #modal input:focus, #modal textarea:focus, #auth-modal input:focus {
            border-color: var(--color-dark);
        }

        .form-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;
        }

        .btn-save {
            width: 100%; padding: 12px; background: var(--color-dark); color: var(--color-light);
            border: 1px solid var(--color-dark); font-family: var(--font-sans); font-weight: 600; font-size: 0.82rem;
            letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; margin-top: 15px; transition: all 0.25s ease;
        }
        .btn-save:hover { background: transparent; color: var(--color-dark); }

        .btn-cancel {
            width: 100%; padding: 10px; background: transparent; color: var(--color-text-sub);
            border: none; cursor: pointer; margin-top: 5px; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: underline;
        }
        .btn-cancel:hover { color: var(--color-red); }
        
        /* AUTH STYLES */
        .auth-title { text-align: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: var(--color-dark); }
        .auth-separator { margin: 1.2rem 0; font-size: 0.75rem; letter-spacing: 0.15em; color: var(--color-text-sub); text-align: center; }

    </style>
</head>
<body>

    <script src="assets/header.js" data-auth-label="navAccount"></script>

    <div class="container">
        <div class="hero-title" data-t="pageTitle">Dernières Sorties</div>
        <div class="hero-subtitle" data-t="pageSub">Les nouveautés Hirono les plus récentes.</div>

        <!-- Sections générées depuis NEW_SECTIONS (voir le script plus bas) -->
        <div id="release-sections"></div>
    </div>

    <!-- MODAL D'ÉDITION D'ITEM -->
    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <div style="text-align:center; margin-bottom:15px;">
                <img id="edit-img" src="" alt="" style="height:120px; object-fit:contain; border:1px solid var(--color-border); background:var(--color-sand);">
                <br>
                <span id="edit-secret-badge" style="display:none; background:var(--color-gold); color:white; font-size:10px; font-weight:800; padding:2px 8px; margin-top:8px; text-transform:uppercase; letter-spacing:0.08em;">Secret Rare</span>
            </div>

            <h2 id="edit-title" style="margin:0; font-size:1.1rem; font-weight:700; text-transform:uppercase;"></h2>
            <p id="edit-subtitle" style="margin:2px 0 20px; color:var(--text-sub); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em;"></p>
            
            <label class="form-label" data-t="lblStatus">Statut</label>
            <select id="input-status" style="margin-bottom:15px;">
                <option value="No status" data-t="optNone">Non possédé</option>
                <option value="Possédé" data-t="optOwned">Dans ma collection</option>
                <option value="Recherché" data-t="optWish">Wishlist</option>
            </select>

            <div class="form-row">
                <div>
                    <label class="form-label" data-t="lblCondition">Condition</label>
                    <select id="input-condition">
                        <option value="Inconnu" data-t="condUnknown">Inconnu</option>
                        <option value="Neuf" data-t="condMint">Neuf (Mint)</option>
                        <option value="Bon" data-t="condGood">Bon</option>
                        <option value="Moyen" data-t="condFair">Moyen</option>
                        <option value="Abimé" data-t="condDamaged">Abimé</option>
                    </select>
                </div>
                <div><label class="form-label" data-t="lblQty">Quantité</label><input type="number" id="input-qty" min="0"></div>
            </div>

            <div class="form-row">
                <div><label class="form-label" data-t="lblPrice">Prix</label><input type="number" id="input-price" step="0.01"></div>
                <div><label class="form-label" data-t="lblDate">Date</label><input type="date" id="input-date"></div>
            </div>
            
            <label class="form-label" data-t="lblNotes">Notes</label>
            <textarea id="input-note" rows="2"></textarea>

            <button class="btn-save" onclick="window.sauvegarder()" data-t="btnSave">Enregistrer</button>
            <button class="btn-cancel" onclick="window.fermer()" data-t="btnClose">Fermer</button>
        </div>
    </div>

    <!-- MODAL D'AUTHENTIFICATION -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content" style="text-align:center; max-width:440px;">
            <div class="auth-title" data-t="authLogin">Connexion</div>
            <p style="color:var(--color-text-sub); font-size:13px; margin-bottom:20px;" data-t="authDesc">
                Sauvegardez votre collection dans le cloud.
            </p>
            
            <input type="email" id="auth-email" placeholder="Email" style="margin-bottom:12px;">
            <input type="password" id="auth-pass" placeholder="Mot de passe" style="margin-bottom:12px;">
            
            <div style="text-align: right; margin-bottom: 15px;">
                <button class="btn-cancel" style="display:inline; padding:0; margin:0; width:auto; font-size:11px;" onclick="window.handleResetPassword()" data-t="btnForgot">Mot de passe oublié ?</button>
            </div>

            <button class="btn-save" onclick="window.handleLogin()" style="background:var(--primary); border-color:var(--primary);" data-t="btnLogin">Se connecter</button>
            
            <div class="auth-separator">OU</div>
            
            <button class="btn-save" onclick="window.handleGoogleLogin()" style="background:var(--surface); color:var(--text-main); border:1px solid var(--color-border); margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:18px; height:18px;" alt="Google">
                <span data-t="btnGoogle">Continuer avec Google</span>
            </button>

            <button class="btn-save" onclick="window.handleRegister()" style="background:var(--surface); color:var(--text-main); border:1px solid var(--color-border);" data-t="btnRegister">
                Créer un compte (Email)
            </button>
            
            <button class="btn-cancel" onclick="window.toggleAuthModal()" data-t="btnCancel">Annuler</button>
        </div>
    </div>

    <div id="footer-placeholder"></div>

<script src="assets/site.js"></script>

<script type="module">
        import { app } from './assets/firebase.js';
        import { withCommon, syncLangToggle } from './assets/i18n.js';
        import { recordVisit } from './assets/activity.js';
        import { baseData } from './data.js?v=2026-11-16-2';
        import { auth, setupAuthModal, updateAuthButtons } from './assets/auth.js';
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const db = getFirestore(app);

        // ================================================================
        // NOUVEAUTÉS AFFICHÉES — seule partie à modifier à chaque mise à jour.
        // Chaque section liste des ID de data.js (nom, image, série et secret
        // sont lus automatiquement dans le catalogue).
        // ================================================================
        const NEW_SECTIONS = [
            {
                title: { fr: "Série Harry Potter", en: "Harry Potter Series" },
                tag: { fr: "NOUVEAU", en: "NEW" },
                ids: ["HPO-RUB", "HPO-SEV", "HPO-ALB", "HPO-TSH", "HPO-LUN", "HPO-SIR", "HPO-LORD",
                      "HPO-QUID", "HPO-RON", "HPO-HED", "HPO-DOB", "HPO-DRA", "HPO-MAND", "HPO-HPSE"]
            },
            {
                title: { fr: "Éditions Spéciales", en: "Special Editions" },
                tag: { fr: "NOUVEAU", en: "NEW" },
                ids: ["SPE-UVWS", "SPE-UVWL", "SPE-SNOFI", "SPE-KOCF"]
            }
        ];

        const catalogById = new Map(baseData.map(b => [b.ID, b]));
        const sections = NEW_SECTIONS.map(section => ({
            ...section,
            items: section.ids.map(id => {
                const b = catalogById.get(id);
                if (!b) { console.warn("Nouveautés : ID absent de data.js :", id); return null; }
                return { id: b.ID, name: b.Name, serie: b.Serie, img: b.Image, isSecret: b["Secret Rare"] === "Yes" };
            }).filter(Boolean)
        }));
        const newReleases = sections.flatMap(s => s.items);

        let userCollection = [];
        let currentUser = null;
        let currentModalItem = null;

        const translations = withCommon({
            fr: {                 navAccount: "Mon Compte",                navNew: "Nouveautés",                pageTitle: "Dernières Sorties",                pageSub: "Les nouveautés Hirono les plus récentes.",                btnAdd: "Ajouter",                 btnOwned: "Possédé",                 btnWish: "Recherché",                 btnSave: "Enregistrer",                btnClose: "Fermer",                lblStatus: "Statut",                optNone: "Non possédé",                optOwned: "Dans ma collection",                optWish: "Wishlist",                lblCondition: "Condition",                condUnknown: "Inconnu",                condMint: "Neuf (Mint)",                condGood: "Bon",                condFair: "Moyen",                condDamaged: "Abimé",                lblQty: "Quantité",                lblPrice: "Prix",                lblDate: "Date d'achat",                lblNotes: "Notes"                },            en: {                 navAccount: "My Account",                navNew: "New Releases",                pageTitle: "Latest Releases",                pageSub: "The most recent Hirono releases.",                btnAdd: "Add",                 btnOwned: "Owned",                 btnWish: "Wishlist",                 btnSave: "Save",                btnClose: "Close",                lblStatus: "Status",                optNone: "Not owned",                optOwned: "In collection",                optWish: "Wishlist",                lblCondition: "Condition",                condUnknown: "Unknown",                condMint: "Mint",                condGood: "Good",                condFair: "Fair",                condDamaged: "Damaged",                lblQty: "Quantity",                lblPrice: "Price",                lblDate: "Purchase Date",                lblNotes: "Notes"                }        });
        
        let currentLang = localStorage.getItem('HRN_LANG') || 'fr';
        function t(key) { return translations[currentLang]?.[key] || key; }

        window.toggleLanguage = () => {
            currentLang = (currentLang === 'fr') ? 'en' : 'fr';
            localStorage.setItem('HRN_LANG', currentLang);
            updateUI();
        };

        window.updateUI = function() {
            syncLangToggle(currentLang);
            
            document.querySelectorAll('[data-t]').forEach(el => {
                const key = el.getAttribute('data-t');
                if(translations[currentLang][key]) el.innerText = translations[currentLang][key];
            });

            const btnText = document.getElementById('auth-status-text');
            const btnTextMob = document.getElementById('auth-status-text-mob');
            if(btnText) btnText.innerText = currentUser ? t('navAccount') : t('authLogin');
            if(btnTextMob) btnTextMob.innerText = currentUser ? t('navAccount') : t('authLogin');

            renderGrids();
        }

        setupAuthModal(() => currentLang);

        onAuthStateChanged(auth, async (user) => {
            if (user) recordVisit(db, user);
            currentUser = user;
            
            if (user) {
                updateAuthButtons(true);
                
                const docRef = doc(db, "users", user.uid);
                try {
                    const snap = await getDoc(docRef);
                    if(snap.exists()) {
                        userCollection = snap.data().collection || [];
                    } else {
                        userCollection = []; 
                    }
                } catch(e) { console.error("Erreur chargement:", e); }
            } else {
                updateAuthButtons(false);
                userCollection = [];
            }
            
            window.updateUI();
            document.body.classList.add('auth-ready');
        });

        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        function renderGrids() {
            const root = document.getElementById('release-sections');
            if (!root) return;
            root.innerHTML = sections.map((s, i) => `
                <div class="release-section">
                    <div class="section-header">
                        <span class="section-name">${esc(s.title[currentLang] || s.title.fr)}</span>
                        <span class="section-tag tag-new">${esc(s.tag[currentLang] || s.tag.fr)}</span>
                    </div>
                    <div class="release-grid" id="release-grid-${i}"></div>
                </div>`).join('');
            sections.forEach((s, i) => {
                if (s.items.length) return renderSection('release-grid-' + i, s.items);
                // Aucune figurine trouvée : catalogue en cache pas encore à jour
                const grid = document.getElementById('release-grid-' + i);
                if (grid) grid.innerHTML = `<p style="grid-column:1/-1; color:var(--color-text-sub); font-size:0.85rem;">${currentLang === 'en'
                    ? 'New figures are loading. Please refresh the page (Ctrl+F5).'
                    : 'Les nouvelles figurines arrivent. Actualisez la page (Ctrl+F5).'}</p>`;
            });
        }

        function renderSection(elementId, items) {
            const container = document.getElementById(elementId);
            if(!container) return; 

            container.innerHTML = items.map(item => {
                const userItem = userCollection.find(u => u.ID === item.id);
                const isOwned = userItem && userItem.Status === 'Possédé';
                const isWished = userItem && userItem.Status === 'Recherché';
                
                let btnClass = "btn-card-action";
                let btnText = "+ " + t('btnAdd');
                let cardClass = "card";

                if (isOwned) { btnClass += " owned"; cardClass += " owned"; btnText = t('btnOwned'); }
                else if (isWished) { btnClass += " wished"; cardClass += " wished"; btnText = t('btnWish'); }

                const secretStyle = item.isSecret ? 'color:var(--color-gold); font-weight:700;' : '';
                const badge = 'NEW';

                let actionBtnHtml = '';
                if (currentUser) {
                    actionBtnHtml = `<button class="${btnClass}">${btnText}</button>`;
                }

                return `
                <div class="${cardClass}" onclick="window.ouvrir('${item.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.ouvrir('${item.id}')}">
                    <span class="card-badge">${badge}</span>
                    <div class="card-img-wrapper">
                        <img src="${item.img}" class="card-img" alt="${item.name}" loading="lazy">
                    </div>
                    <div class="card-name" style="${secretStyle}">${item.name}</div>
                    <div class="card-serie">${item.serie}</div>
                    ${actionBtnHtml}
                </div>`;
            }).join('');
        }

        window.ouvrir = function(id) {
            if(!currentUser) { 
                alert("Vous devez être connecté pour gérer votre collection !"); 
                return; 
            }

            const item = newReleases.find(i => i.id === id);
            if(!item) return;

            currentModalItem = item;
            const existing = userCollection.find(i => i.ID === id);

            document.getElementById('edit-img').src = item.img;
            document.getElementById('edit-title').innerText = item.name;
            document.getElementById('edit-subtitle').innerText = item.serie;

            const badge = document.getElementById('edit-secret-badge');
            if(badge) badge.style.display = item.isSecret ? 'inline-block' : 'none';

            if (existing) {
                document.getElementById('input-status').value = existing.Status || 'No status';
                document.getElementById('input-condition').value = existing.Condition || 'Inconnu';
                document.getElementById('input-qty').value = existing.Quantity || 1;
                document.getElementById('input-price').value = existing["Purchase price"] || '';
                document.getElementById('input-date').value = existing["Purchase date"] || '';
                document.getElementById('input-note').value = existing.Notes || existing.Note || '';
            } else {
                document.getElementById('input-status').value = 'No status';
                document.getElementById('input-condition').value = 'Inconnu';
                document.getElementById('input-qty').value = 1;
                document.getElementById('input-price').value = '';
                document.getElementById('input-date').value = new Date().toISOString().split('T')[0];
                document.getElementById('input-note').value = '';
            }

            document.getElementById('modal').style.display = 'flex';
        };

        window.fermer = function() {
            document.getElementById('modal').style.display = 'none';
        };

        window.sauvegarder = async function() {
            if (!currentUser) {
                alert("Erreur : Vous avez été déconnecté. Veuillez rafraîchir la page.");
                return;
            }
            if (!currentModalItem) {
                alert("Erreur : Aucun objet sélectionné.");
                return;
            }

            const status = document.getElementById('input-status').value;
            
            if(status === 'No status') {
                const idx = userCollection.findIndex(i => i.ID === currentModalItem.id);
                if(idx > -1) {
                    if(confirm("Voulez-vous retirer cet objet de votre collection ?")) {
                        userCollection.splice(idx, 1);
                    } else {
                        return;
                    }
                }
            } else {
                const newItem = {
                    ID: currentModalItem.id,
                    Status: status,
                    Condition: document.getElementById('input-condition').value,
                    Quantity: parseInt(document.getElementById('input-qty').value) || 1,
                    "Purchase price": parseFloat(document.getElementById('input-price').value) || 0,
                    "Purchase date": document.getElementById('input-date').value || "",
                    Note: document.getElementById('input-note').value || ""
                };
                const previous = userCollection.find(i => i.ID === newItem.ID);
                newItem.Currency = previous?.Currency || "EUR";

                const idx = userCollection.findIndex(i => i.ID === newItem.ID);
                if(idx > -1) {
                    userCollection[idx] = newItem;
                } else {
                    userCollection.push(newItem);
                }
            }

            // Mêmes champs que la page Collection (dashboard.html) : on garde la devise et la note existantes
            const collectionPropre = userCollection.map(item => ({
                ID: item.ID,
                Status: item.Status || "No status",
                Condition: item.Condition || "Inconnu",
                Quantity: item.Quantity || 0,
                "Purchase price": item["Purchase price"] || 0,
                Currency: item.Currency || "EUR",
                "Purchase date": item["Purchase date"] || "",
                Note: item.Note ?? item.Notes ?? ""
            }));

            try {
                await setDoc(doc(db, "users", currentUser.uid), { collection: collectionPropre }, { merge: true });
                userCollection = collectionPropre;
                renderGrids();
                window.fermer();
            } catch(e) {
                console.error("Erreur Firebase:", e);
                alert("Une erreur est survenue lors de la sauvegarde : " + e.message);
            }
        };

        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            const authModal = document.getElementById('auth-modal');
            if (event.target == modal) window.fermer();
            if (event.target == authModal) window.toggleAuthModal();
        }

        fetch('footer.html')
            .then(response => {
                if (!response.ok) throw new Error("Erreur chargement footer");
                return response.text();
            })
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
                if(window.updateUI) window.updateUI();
                if(window.initCookieLogic) window.initCookieLogic();
            })
            .catch(error => console.error('Erreur Footer:', error));
    </script>
</body>
</html>
