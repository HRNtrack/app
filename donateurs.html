<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRNtrack</title>
    <link rel="icon" type="image/vnd.icon" href="https://i.postimg.cc/pLqpbbHb/IMG-0226f.png">
    
    <!-- Typographie Poppins -->
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/common.css">

    <style>

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            font-family: var(--font-sans); 
            margin: 0; 
            padding: 0;
            -webkit-font-smoothing: antialiased; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            padding-bottom: var(--nav-height-mobile);
            opacity: 0; 
            transition: opacity 0.3s ease-in-out;
        }
        body.auth-ready { opacity: 1; }

        /* --- NAVIGATION SUPÉRIEURE --- */

        .nav-link:hover, .nav-link.active {
            border-bottom-color: var(--color-dark);
            font-weight: 600;
        }

        .btn-auth-trigger.logged-in {
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-auth-trigger.logged-in:hover {
            background: var(--primary);
            color: #ffffff;
        }

        /* Mobile Hamburger Button */

        .mobile-drawer .nav-link {
            font-size: 1rem;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--color-border);
            width: 100%;
        }

        @media (min-width: 993px) { body { padding-bottom: 0; } }

        /* --- CONTAINER & DONATIONS --- */
        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; width: 100%; box-sizing: border-box; flex: 1; }
        
        .goal-card { 
            background: #FFFFFF; 
            padding: 40px; 
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow); 
            text-align: center; 
            margin-bottom: 40px; 
            position: relative; 
            overflow: hidden; 
        }
        .goal-title { font-size: 0.75rem; color: var(--color-text-sub); text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; margin-bottom: 10px; }
        .goal-amount { font-size: 3rem; font-weight: 800; color: var(--color-dark); margin: 0; }
        
        .progress-container { height: 20px; background: var(--color-sand); border: 1px solid var(--color-border); overflow: hidden; margin: 20px auto; max-width: 600px; position: relative; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 1.5s ease; }
        .progress-text { position: absolute; width: 100%; text-align: center; top: 0; line-height: 20px; font-size: 11px; font-weight: 800; color: var(--color-dark); z-index: 2; }

        .donors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .donor-card { 
            background: #FFFFFF; 
            padding: 16px; 
            border: 1px solid var(--color-border); 
            box-shadow: var(--shadow); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border-left: 4px solid var(--primary); 
        }
        .donor-name { font-weight: 600; font-size: 0.88rem; color: var(--color-dark); }
        .donor-amount { font-weight: 700; color: var(--primary); font-size: 0.95rem; background: var(--color-sand); padding: 4px 10px; }

        #admin-panel { display: none; background: var(--color-dark); padding: 20px; border: 1px solid var(--color-dark); margin-bottom: 30px; color: white; }
        .admin-row { display: flex; gap: 10px; margin-top: 10px; }
        .admin-input { flex: 1; padding: 10px; border: 1px solid var(--color-border); background: #fff; font-family: var(--font-sans); font-size: 0.85rem; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 10px 20px; font-family: var(--font-sans); cursor: pointer; font-weight: 600; text-transform: uppercase; font-size: 0.78rem; letter-spacing: 0.08em; transition: 0.25s; }
        .btn-add:hover { background: var(--primary-dark); }

        /* MODALS & INPUTS */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(26, 26, 26, 0.7); 
            z-index: 3000; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(4px); 
            padding: 1rem;
        }
        .modal-content { 
            background: #FCFBF8; 
            border: 1px solid var(--color-border);
            width: 100%; 
            max-width: 440px; 
            padding: 2.2rem; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); 
            max-height: 90vh; 
            overflow-y: auto; 
            position: relative; 
        }
        
        input, select, textarea {
            width: 100%; padding: 10px 12px; border: 1px solid var(--color-border);
            font-family: var(--font-sans); font-size: 0.85rem; box-sizing: border-box; background: #FFFFFF;
            color: var(--color-dark); outline: none; transition: border-color 0.2s ease;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--color-dark); }

        .btn-save { 
            width: 100%; 
            background: var(--color-dark); 
            color: var(--color-light); 
            border: 1px solid var(--color-dark); 
            padding: 12px; 
            font-family: var(--font-sans);
            font-weight: 600; 
            font-size: 0.82rem; 
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer; 
            margin-top: 15px; 
            transition: all 0.25s ease; 
        }
        .btn-save:hover { background: transparent; color: var(--color-dark); }
        .btn-cancel { 
            width: 100%; 
            background: transparent; 
            border: none; 
            color: var(--color-text-sub); 
            padding: 10px; 
            cursor: pointer; 
            margin-top: 5px; 
            font-size: 0.78rem; 
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: underline;
        }
        .btn-cancel:hover { color: var(--color-red); }

        .auth-title { text-align: center; font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: var(--color-dark); }
        .auth-separator { margin: 1.2rem 0; font-size: 0.75rem; letter-spacing: 0.15em; color: var(--color-text-sub); text-align: center; }
        
        /* BOUTON KO-FI CUSTOM */
        .btn-kofi-custom {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            background: var(--color-dark);
            color: white; text-decoration: none;
            padding: 12px 28px;
            font-family: var(--font-sans);
            font-weight: 600; font-size: 0.82rem;
            letter-spacing: 0.08em; text-transform: uppercase;
            border: 1px solid var(--color-dark);
            transition: all 0.25s ease;
            margin: 20px auto 0;
        }

        .btn-kofi-custom:hover {
            background: transparent;
            color: var(--color-dark);
        }

        h2 { font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid var(--color-border); padding-bottom: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>
    
    <script src="assets/header.js" data-active="donateurs"></script>

    <div class="container">
        <div id="admin-panel">
            <h3 style="margin:0 0 10px 0; font-size:0.9rem; text-transform:uppercase; letter-spacing:0.08em;">👑 Ajouter un donateur</h3>
            <div class="admin-row">
                <input type="text" id="new-name" class="admin-input" placeholder="Nom">
                <input type="number" id="new-amount" class="admin-input" placeholder="€">
                <button class="btn-add" onclick="window.addDonation()">Ajouter</button>
            </div>
        </div>

        <div class="goal-card">
            <div class="goal-title" data-t="lblGoalTitle">Objectif du moment</div>
            <h1 class="goal-amount" id="total-raised">0€</h1>
            <div style="color:var(--text-sub); font-size:0.85rem;"><span data-t="lblGoalTarget">sur</span> <span id="goal-target-text">0€</span></div>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
                <div id="progress-percent" class="progress-text">0%</div>
            </div>
            <p style="font-size:12px; color:#9CA3AF;"><span data-t="lblGoalDesc">Merci de votre soutien !</span></p>

            <a href="https://ko-fi.com/U7U11QWR1G" target="_blank" rel="noopener" class="btn-kofi-custom">
                <span data-t="btnKofi">Support me on Ko-fi</span>
            </a>
        </div>

        <h2><span data-t="lblWall">Mur des Donateurs</span></h2>
        <div id="donors-list" class="donors-grid"></div>
    </div>

    <!-- MODAL D'AUTHENTIFICATION -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content" style="text-align:center; max-width:440px;">
            <div class="auth-title" data-t="authLogin">Connexion</div>
            <p style="color:var(--color-text-sub); font-size:13px; margin-bottom:20px;" data-t="authDesc">Sauvegardez votre collection dans le cloud.</p>
            
            <input type="email" id="auth-email" placeholder="Email" style="margin-bottom:12px;">
            <input type="password" id="auth-pass" placeholder="Mot de passe" style="margin-bottom:12px;">
            
            <div style="text-align: right; margin-bottom: 15px;">
                <button class="btn-cancel" style="display:inline; padding:0; margin:0; width:auto; font-size:11px;" onclick="window.handleResetPassword()" data-t="btnForgot">Mot de passe oublié ?</button>
            </div>

            <button class="btn-save" onclick="window.handleLogin()" data-t="btnLogin">Se connecter</button>
            
            <div class="auth-separator">OU</div>
            
            <button class="btn-save" onclick="window.handleGoogleLogin()" style="background:white; color:var(--text-main); border:1px solid var(--color-border); margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:18px; height:18px;" alt="Google">
                <span data-t="btnGoogle">Continuer avec Google</span>
            </button>

            <button class="btn-save" onclick="window.handleRegister()" style="background:white; color:var(--text-main); border:1px solid var(--color-border);" data-t="btnRegister">Créer un compte (Email)</button>
            <button class="btn-cancel" onclick="window.toggleAuthModal()" data-t="btnCancel">Annuler</button>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="assets/site.js"></script>

    <script type="module">
        import { app } from './assets/firebase.js';
        import { withCommon, syncLangToggle } from './assets/i18n.js';
        import { auth, setupAuthModal, updateAuthButtons, updateAuthLabel } from './assets/auth.js';
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, Timestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const db = getFirestore(app);

        const GOAL_AMOUNT = 200;
        const ADMIN_EMAIL = "hironotrack@gmail.com"; 

        const translations = withCommon({
            fr: {                 footerAbout: "À propos",                 lblGoalTitle: "Objectif du moment", lblGoalTarget: "sur", lblGoalDesc: "Merci de votre soutien !", lblWall: "Mur des Donateurs",                btnKofi: "Soutenez-moi sur Ko-fi"                },            en: {                 footerAbout: "About",                 lblGoalTitle: "Current Goal", lblGoalTarget: "of", lblGoalDesc: "Thanks for your support!", lblWall: "Wall of Donors",                btnKofi: "Support me on Ko-fi"                }        });

        let currentLang = localStorage.getItem('HRN_LANG') || 'fr';
        
        window.toggleLanguage = () => { 
            currentLang = (currentLang === 'fr') ? 'en' : 'fr'; 
            localStorage.setItem('HRN_LANG', currentLang); 
            updateUIText(); 
            loadDonations(); 
        };

        window.updateUIText = function() {
            syncLangToggle(currentLang);
            const t = translations[currentLang];
            document.querySelectorAll('[data-t]').forEach(el => { const key = el.getAttribute('data-t'); if(t[key]) el.innerText = t[key]; });
            updateAuthLabel(t);
        };

        setupAuthModal(() => currentLang);
        
        window.onclick = function(event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.style.display = "none";
            }
        }

        async function loadDonations() {
            const t = translations[currentLang];
            const q = query(collection(db, "donations"), orderBy("date", "desc"));
            const snapshot = await getDocs(q);
            let total = 0, html = "";
            const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            snapshot.forEach(doc => {
                const data = doc.data();
                const amount = parseFloat(data.amount) || 0;
                total += amount;
                html += `<div class="donor-card"><span class="donor-name">${esc(data.name)}</span><span class="donor-amount">${amount}€</span></div>`;
            });
            document.getElementById('donors-list').innerHTML = html || `<p style='color:gray'>${t.lblWall}...</p>`;
            document.getElementById('total-raised').innerText = total.toFixed(2) + "€";
            document.getElementById('goal-target-text').innerText = GOAL_AMOUNT + "€";
            let percent = Math.min((total / GOAL_AMOUNT) * 100, 100);
            document.getElementById('progress-bar').style.width = percent + "%";
            document.getElementById('progress-percent').innerText = Math.round(percent) + "%";
        }

        onAuthStateChanged(auth, (user) => {
            updateUIText();
            if (user) {
                updateAuthButtons(true);
                if(user.email === ADMIN_EMAIL) document.getElementById('admin-panel').style.display = 'block';
            } else {
                updateAuthButtons(false);
            }
            document.body.classList.add('auth-ready');
        });

        window.addDonation = async () => {
            const n = document.getElementById('new-name').value, a = document.getElementById('new-amount').value;
            if(!n || !a) return;
            await addDoc(collection(db, "donations"), { name: n, amount: parseFloat(a), date: Timestamp.now() });
            location.reload();
        };

        loadDonations();

        fetch('footer.html')
            .then(response => {
                if (!response.ok) throw new Error("Erreur chargement footer");
                return response.text();
            })
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
                if(window.updateUIText) window.updateUIText();
                if(window.initCookieLogic) window.initCookieLogic();
            })
            .catch(error => console.error('Erreur Footer:', error));
    </script>
</body>
</html>
